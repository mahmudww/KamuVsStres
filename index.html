<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PLAYER vs. STRES: The Mental Ping Pong</title>

    <style>
        :root {
            --color-bg-dark: #161625;
            --color-bg-light: #202035;
            --color-focus: #4ecdc4;
            --color-stress: #ff6b6b;
            --color-ball: #ffee00;
            --color-text: #66fcf1;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px var(--color-text);
                background-color: rgba(102, 252, 241, 0.5);
            }

            50% {
                box-shadow: 0 0 20px var(--color-text);
                background-color: var(--color-text);
            }

            100% {
                box-shadow: 0 0 5px var(--color-text);
                background-color: rgba(102, 252, 241, 0.5);
            }
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px);
            }

            25% {
                transform: translate(-1px, -2px);
            }

            50% {
                transform: translate(-3px, 0px);
            }

            75% {
                transform: translate(3px, 2px);
            }

            100% {
                transform: translate(1px, 1px);
            }
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            min-height: 100dvh;

            margin: 0;
            padding: 15px;

            background-color: var(--color-bg-dark);

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            overflow: hidden;
            color: var(--color-text);

            touch-action: manipulation;
        }

        /* =====================================================
           SCORE BAR
        ===================================================== */

        #info-bar {
            width: min(500px, 100%);

            display: flex;
            justify-content: space-between;
            gap: 10px;

            margin-bottom: 15px;
            padding: 10px 15px;

            background-color: var(--color-bg-light);

            border-radius: 15px;

            font-size: clamp(0.75rem, 3.5vw, 1.2rem);
            font-weight: bold;

            box-shadow:
                -5px -5px 10px rgba(45, 45, 60, 0.4),
                5px 5px 10px rgba(0, 0, 0, 0.8);

            flex-shrink: 0;
        }

        #player-score {
            color: var(--color-focus);
        }

        #opponent-score {
            color: var(--color-stress);
            text-align: right;
        }

        /* =====================================================
           GAME BOARD
        ===================================================== */

        #game-board {
            width: min(500px, 100%);
            aspect-ratio: 5 / 7;

            border: 3px solid var(--color-text);

            background-color: var(--color-bg-dark);

            position: relative;
            overflow: hidden;

            transition:
                background-color 0.4s ease,
                border-color 0.4s ease;

            box-shadow:
                inset 5px 5px 15px rgba(0, 0, 0, 0.8),
                inset -5px -5px 15px rgba(45, 45, 60, 0.4),
                0 0 50px rgba(102, 252, 241, 0.2);

            border-radius: 10px;

            flex-shrink: 1;
        }

        .board-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        .score-focus-vfx {
            background-color: #0c3330 !important;
            border-color: var(--color-focus) !important;
        }

        .score-stress-vfx {
            background-color: #3b1212 !important;
            border-color: var(--color-stress) !important;
        }

        /* =====================================================
           CENTER LINE
        ===================================================== */

        #center-line {
            position: absolute;

            top: 50%;
            left: 0;

            width: 100%;
            height: 2px;

            background-color: rgba(102, 252, 241, 0.5);

            transform: translateY(-50%);

            z-index: 5;

            animation: pulse 2s infinite alternate;
        }

        /* =====================================================
           PADDLES
        ===================================================== */

        #top-paddle,
        #bottom-paddle {
            position: absolute;

            width: 16%;
            max-width: 80px;
            height: 15px;

            border-radius: 5px;

            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: clamp(0.45rem, 1.8vw, 0.7rem);
            font-weight: bold;

            will-change: left, transform;
        }

        #top-paddle {
            top: 20px;

            background-color: var(--color-stress);

            box-shadow:
                0 0 10px rgba(255, 107, 107, 0.5);

            color: var(--color-bg-dark);
        }

        #bottom-paddle {
            bottom: 20px;

            background-color: var(--color-focus);

            box-shadow:
                0 0 10px rgba(78, 205, 196, 0.5);

            color: var(--color-bg-dark);
        }

        .paddle-bounce-stress {
            background-color: var(--color-ball) !important;
            transform: translateY(5px);
        }

        .paddle-bounce-focus {
            background-color: var(--color-ball) !important;
            transform: translateY(-5px);
        }

        .paddle-trail-stress {
            box-shadow:
                0 0 20px rgba(255, 107, 107, 1),
                0 0 5px rgba(255, 107, 107, 1) !important;
        }

        .paddle-trail-focus {
            box-shadow:
                0 0 20px rgba(78, 205, 196, 1),
                0 0 5px rgba(78, 205, 196, 1) !important;
        }

        .paddle-afterglow-stress {
            box-shadow:
                0 0 40px var(--color-ball),
                0 0 10px var(--color-stress) !important;
        }

        .paddle-afterglow-focus {
            box-shadow:
                0 0 40px var(--color-ball),
                0 0 10px var(--color-focus) !important;
        }

        /* =====================================================
           BALL
        ===================================================== */

        #ball {
            position: absolute;

            width: 15px;
            height: 15px;

            background-color: var(--color-ball);

            border-radius: 50%;

            z-index: 100;

            will-change: left, top, box-shadow, transform;

            box-shadow:
                0 0 0 var(--color-ball);

            pointer-events: none;
        }

        .ball-explosion-vfx {
            transform: scale(3);
            opacity: 0;
        }

        /* =====================================================
           PARTICLES
        ===================================================== */

        #particle-container {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 90;

            overflow: hidden;
        }

        .particle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background-color: var(--color-ball);

            opacity: 0;

            transform: scale(0);

            will-change: transform, opacity;
        }

        .particle-show {
            opacity: 0.8;
            transform: scale(1);
        }

        /* =====================================================
           COUNTDOWN
        ===================================================== */

        #countdown-display {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: var(--color-ball);

            font-size: clamp(3rem, 15vw, 5rem);

            font-weight: bold;

            text-shadow:
                0 0 20px var(--color-ball);

            z-index: 300;

            display: none;
        }

        /* =====================================================
           GAME OVER
        ===================================================== */

        #game-message {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.9);

            color: white;

            display: none;

            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: clamp(1.2rem, 5vw, 2rem);

            text-align: center;

            z-index: 200;

            padding: 20px;

            text-shadow:
                0 0 20px rgba(78, 205, 196, 0.7);
        }

        #message-text {
            max-width: 90%;
        }

        #final-score {
            margin-top: 10px;
        }

        #game-message button {
            padding: 12px 24px;

            margin-top: 20px;

            font-size: 0.8em;

            cursor: pointer;

            background-color: var(--color-focus);

            color: var(--color-bg-dark);

            border: none;

            border-radius: 15px;

            box-shadow:
                -5px -5px 10px rgba(45, 45, 60, 0.4),
                5px 5px 10px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(78, 205, 196, 0.5);

            touch-action: manipulation;
        }

        /* =====================================================
           MOBILE BUTTONS
        ===================================================== */

        #touch-controls {
            width: min(500px, 100%);

            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-top: 15px;

            flex-shrink: 0;
        }

        .touch-button {
            flex: 1;

            min-height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: var(--color-bg-light);

            color: var(--color-focus);

            font-weight: bold;

            text-align: center;

            border-radius: 15px;

            cursor: pointer;

            user-select: none;

            -webkit-user-select: none;

            box-shadow:
                -5px -5px 10px rgba(45, 45, 60, 0.4),
                5px 5px 10px rgba(0, 0, 0, 0.8),
                0 0 5px rgba(78, 205, 196, 0.5);

            transition:
                transform 0.05s,
                background-color 0.05s;

            touch-action: none;
        }

        .touch-button:active {
            background-color: var(--color-focus);
            color: var(--color-bg-dark);

            transform: scale(0.97);

            box-shadow:
                inset 3px 3px 5px rgba(0, 0, 0, 0.8),
                inset -3px -3px 5px rgba(45, 45, 60, 0.4);
        }

        /* =====================================================
           SMALL PHONE
        ===================================================== */

        @media (max-height: 700px) {

            body {
                padding: 8px;
            }

            #info-bar {
                margin-bottom: 8px;
                padding: 7px 10px;
            }

            #touch-controls {
                margin-top: 8px;
            }

            .touch-button {
                min-height: 45px;
            }

            #top-paddle {
                top: 12px;
            }

            #bottom-paddle {
                bottom: 12px;
            }
        }

        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 700px) {

            .touch-button {
                min-height: 60px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         SCORE
    ===================================================== -->

    <div id="info-bar">
        <div id="player-score">
            PLAYER (Kamu): 0
        </div>

        <div id="opponent-score">
            STRES (Musuh): 0
        </div>
    </div>


    <!-- =====================================================
         GAME BOARD
    ===================================================== -->

    <div id="game-board">

        <div id="center-line"></div>

        <div id="top-paddle">
            STRES
        </div>

        <div id="ball"></div>

        <div id="bottom-paddle">
            PLAYER
        </div>

        <div id="particle-container"></div>

        <div id="countdown-display"></div>

        <div id="game-message">

            <div id="message-text"></div>

            <div id="final-score"></div>

            <button onclick="resetGame()">
                COBA LAGI
            </button>

        </div>

    </div>


    <!-- =====================================================
         MOBILE CONTROLS
    ===================================================== -->

    <div id="touch-controls">

        <div
            class="touch-button"
            id="left-button">
            KIRI (◀)
        </div>

        <div
            class="touch-button"
            id="right-button">
            KANAN (▶)
        </div>

    </div>


<script>

    // =========================================================
    // DOM ELEMENTS
    // =========================================================

    const gameBoard =
        document.getElementById('game-board');

    const bottomPaddle =
        document.getElementById('bottom-paddle');

    const topPaddle =
        document.getElementById('top-paddle');

    const ballElement =
        document.getElementById('ball');

    const particleContainer =
        document.getElementById('particle-container');

    const playerScoreElement =
        document.getElementById('player-score');

    const opponentScoreElement =
        document.getElementById('opponent-score');

    const gameMessage =
        document.getElementById('game-message');

    const messageText =
        document.getElementById('message-text');

    const finalScore =
        document.getElementById('final-score');

    const countdownDisplay =
        document.getElementById('countdown-display');

    const leftButton =
        document.getElementById('left-button');

    const rightButton =
        document.getElementById('right-button');


    // =========================================================
    // GAME DIMENSIONS
    // =========================================================

    const boardWidth = 500;
    const boardHeight = 700;

    const paddleWidth = 80;
    const paddleHeight = 15;

    const ballSize = 15;

    const STARTING_BALL_Y =
        (boardHeight / 3) - (ballSize / 3);


    // =========================================================
    // PADDLE STATE
    // =========================================================

    let playerX =
        (boardWidth / 2) -
        (paddleWidth / 2);

    let opponentX =
        (boardWidth / 2) -
        (paddleWidth / 2);


    const FIXED_PADDLE_SPEED = 800;

    let keys = {};


    // =========================================================
    // BALL STATE
    // =========================================================

    let ballX;
    let ballY;

    let ballSpeedX;
    let ballSpeedY;

    const initialBallSpeed = 500;


    // =========================================================
    // SCORE
    // =========================================================

    let playerScore = 0;
    let opponentScore = 0;

    const maxScore = 5;


    // =========================================================
    // AI
    // =========================================================

    let opponentSpeedMultiplier = 1.0;

    const SPEED_INCREMENT_PER_POINT = 0.15;


    // =========================================================
    // GAME STATE
    // =========================================================

    let isGameRunning = false;
    let isPaused = true;

    let lastTimestamp = 0;

    let particleInterval = null;


    // =========================================================
    // 🔊 AUDIO SYSTEM
    // =========================================================

    let audioContext = null;


    function initAudio() {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (AudioContext) {
                audioContext =
                    new AudioContext();
            }
        }

        if (
            audioContext &&
            audioContext.state === 'suspended'
        ) {
            audioContext.resume();
        }
    }


    function playTone(
        frequency,
        duration,
        type = 'sine',
        volume = 0.08
    ) {

        if (!audioContext) return;

        const oscillator =
            audioContext.createOscillator();

        const gainNode =
            audioContext.createGain();


        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );


        gainNode.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );


        gainNode.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gainNode);

        gainNode.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );
    }


    // 🏓 PADDLE HIT

    function playPaddleSound() {

        if (!audioContext) return;

        playTone(
            420,
            0.07,
            'square',
            0.055
        );

        setTimeout(() => {

            playTone(
                650,
                0.05,
                'sine',
                0.035
            );

        }, 25);
    }


    // 🧱 WALL HIT

    function playWallSound() {

        playTone(
            280,
            0.05,
            'triangle',
            0.03
        );
    }


    // ⭐ SCORE

    function playScoreSound(isPlayerScore) {

        if (!audioContext) return;


        if (isPlayerScore) {

            playTone(
                520,
                0.1,
                'sine',
                0.06
            );

            setTimeout(() => {

                playTone(
                    780,
                    0.15,
                    'sine',
                    0.07
                );

            }, 100);

        } else {

            playTone(
                400,
                0.1,
                'sawtooth',
                0.045
            );

            setTimeout(() => {

                playTone(
                    220,
                    0.2,
                    'sawtooth',
                    0.05
                );

            }, 100);
        }
    }


    // 🔢 COUNTDOWN

    function playCountdownSound(count) {

        if (!audioContext) return;


        if (count > 0) {

            playTone(
                500,
                0.08,
                'square',
                0.05
            );

        } else {

            playTone(
                750,
                0.12,
                'sine',
                0.06
            );

            setTimeout(() => {

                playTone(
                    1000,
                    0.18,
                    'sine',
                    0.07
                );

            }, 100);
        }
    }


    // 🏆 GAME OVER

    function playGameOverSound(playerWon) {

        if (!audioContext) return;


        if (playerWon) {

            playTone(
                523,
                0.12,
                'sine',
                0.06
            );

            setTimeout(() => {

                playTone(
                    659,
                    0.12,
                    'sine',
                    0.06
                );

            }, 120);

            setTimeout(() => {

                playTone(
                    784,
                    0.25,
                    'sine',
                    0.07
                );

            }, 240);

        } else {

            playTone(
                350,
                0.15,
                'triangle',
                0.05
            );

            setTimeout(() => {

                playTone(
                    250,
                    0.25,
                    'triangle',
                    0.05
                );

            }, 150);
        }
    }


    // =========================================================
    // INPUT RESET
    // =========================================================

    function resetInputState() {

        keys['ArrowLeft'] = false;
        keys['ArrowRight'] = false;

        bottomPaddle.classList.remove(
            'paddle-trail-focus'
        );

        topPaddle.classList.remove(
            'paddle-trail-stress'
        );
    }


    // =========================================================
    // PARTICLE SYSTEM
    // =========================================================

    function createBallParticle() {

        if (
            !isGameRunning ||
            isPaused
        ) {
            return;
        }


        const p =
            document.createElement('div');

        p.className = 'particle';


        const x =
            ballX +
            ballSize / 2 -
            2;

        const y =
            ballY +
            ballSize / 2 -
            2;


        p.style.left =
            `${x}px`;

        p.style.top =
            `${y}px`;


        const size =
            Math.random() * 3 + 2;


        p.style.width =
            `${size}px`;

        p.style.height =
            `${size}px`;


        particleContainer.appendChild(p);


        requestAnimationFrame(() => {

            p.classList.add(
                'particle-show'
            );

        });


        setTimeout(() => {

            p.style.opacity = '0';

            p.style.transform =
                'scale(0.1)';

        }, 150);


        setTimeout(() => {

            p.remove();

        }, 650);
    }


    function startParticleTrail() {

        stopParticleTrail();

        particleInterval =
            setInterval(
                createBallParticle,
                45
            );
    }


    function stopParticleTrail() {

        if (particleInterval) {

            clearInterval(
                particleInterval
            );

            particleInterval = null;
        }
    }


    // =========================================================
    // PADDLE VFX
    // =========================================================

    function triggerPaddleVFX(
        paddleElement,
        vfxClass
    ) {

        const afterglowClass =
            vfxClass.includes('focus')
                ? 'paddle-afterglow-focus'
                : 'paddle-afterglow-stress';


        paddleElement.classList.add(
            vfxClass
        );

        paddleElement.classList.add(
            afterglowClass
        );


        setTimeout(() => {

            paddleElement.classList.remove(
                vfxClass
            );

        }, 100);


        setTimeout(() => {

            paddleElement.classList.remove(
                afterglowClass
            );

        }, 200);
    }


    // =========================================================
    // SCORE VFX
    // =========================================================

    function triggerScoreVFX(
        isPlayerScore
    ) {

        const vfxClass =
            isPlayerScore
                ? 'score-focus-vfx'
                : 'score-stress-vfx';


        gameBoard.classList.add(
            vfxClass
        );

        gameBoard.classList.add(
            'board-shake'
        );


        setTimeout(() => {

            gameBoard.classList.remove(
                vfxClass
            );

            gameBoard.classList.remove(
                'board-shake'
            );

        }, 400);
    }


    // =========================================================
    // BALL EXPLOSION
    // =========================================================

    function triggerBallExplosion() {

        ballElement.classList.add(
            'ball-explosion-vfx'
        );
    }


    // =========================================================
    // BALL VFX
    // =========================================================

    function updateBallVFX() {

        if (
            !isGameRunning ||
            isPaused
        ) {

            ballElement.style.boxShadow =
                '0 0 0 var(--color-ball)';

            return;
        }


        const currentSpeedSq =
            ballSpeedX ** 2 +
            ballSpeedY ** 2;


        const maxSpeedSq =
            (2.0 * initialBallSpeed) ** 2;


        const speedRatio =
            Math.min(
                1,
                currentSpeedSq /
                maxSpeedSq
            );


        const blurRadius =
            speedRatio * 10;


        const offsetX =
            -(ballSpeedX * 0.005) *
            speedRatio;


        const offsetY =
            -(ballSpeedY * 0.005) *
            speedRatio;


        ballElement.style.boxShadow =
            `${offsetX}px ${offsetY}px ${blurRadius}px var(--color-ball)`;
    }


    // =========================================================
    // PADDLE TRAIL
    // =========================================================

    function updatePaddleTrail() {

        const playerIsMoving =
            keys['ArrowLeft'] ||
            keys['ArrowRight'];


        if (playerIsMoving) {

            bottomPaddle.classList.add(
                'paddle-trail-focus'
            );

        } else {

            bottomPaddle.classList.remove(
                'paddle-trail-focus'
            );
        }


        const isAITurn =
            ballSpeedY < 0;


        const isAIPursuing =
            Math.abs(
                ballX +
                ballSize / 2 -
                (
                    opponentX +
                    paddleWidth / 2
                )
            ) > 5;


        if (
            isAITurn &&
            isAIPursuing
        ) {

            topPaddle.classList.add(
                'paddle-trail-stress'
            );

        } else {

            topPaddle.classList.remove(
                'paddle-trail-stress'
            );
        }
    }


    // =========================================================
    // PLAYER INPUT
    // =========================================================

    function setMovement(
        key,
        value
    ) {

        initAudio();


        if (
            !isGameRunning ||
            isPaused
        ) {
            return;
        }


        keys[key] = value;
    }


    // =========================================================
    // KEYBOARD
    // =========================================================

    document.addEventListener(
        'keydown',
        (e) => {

            if (
                e.key === 'ArrowLeft' ||
                e.key.toLowerCase() === 'a'
            ) {

                setMovement(
                    'ArrowLeft',
                    true
                );

            } else if (
                e.key === 'ArrowRight' ||
                e.key.toLowerCase() === 'd'
            ) {

                setMovement(
                    'ArrowRight',
                    true
                );
            }


            if (
                e.key.includes('Arrow')
            ) {

                e.preventDefault();
            }
        }
    );


    document.addEventListener(
        'keyup',
        (e) => {

            if (
                e.key === 'ArrowLeft' ||
                e.key.toLowerCase() === 'a'
            ) {

                setMovement(
                    'ArrowLeft',
                    false
                );

            } else if (
                e.key === 'ArrowRight' ||
                e.key.toLowerCase() === 'd'
            ) {

                setMovement(
                    'ArrowRight',
                    false
                );
            }
        }
    );


    // =========================================================
    // TOUCH BUTTON
    // =========================================================

    function startMoveLeft() {

        initAudio();

        setMovement(
            'ArrowLeft',
            true
        );
    }


    function startMoveRight() {

        initAudio();

        setMovement(
            'ArrowRight',
            true
        );
    }


    function stopMove() {

        keys['ArrowLeft'] = false;
        keys['ArrowRight'] = false;
    }


    // Pointer events bekerja untuk mouse + touch
    leftButton.addEventListener(
        'pointerdown',
        (e) => {

            e.preventDefault();

            startMoveLeft();

        }
    );


    rightButton.addEventListener(
        'pointerdown',
        (e) => {

            e.preventDefault();

            startMoveRight();

        }
    );


    leftButton.addEventListener(
        'pointerup',
        stopMove
    );

    rightButton.addEventListener(
        'pointerup',
        stopMove
    );

    leftButton.addEventListener(
        'pointercancel',
        stopMove
    );

    rightButton.addEventListener(
        'pointercancel',
        stopMove
    );

    leftButton.addEventListener(
        'pointerleave',
        stopMove
    );

    rightButton.addEventListener(
        'pointerleave',
        stopMove
    );


    // =========================================================
    // COUNTDOWN
    // =========================================================

    function startCountdown(directionTo) {

        isGameRunning = false;
        isPaused = true;


        countdownDisplay.style.display =
            'block';


        let count = 3;


        resetInputState();

        stopParticleTrail();


        ballX =
            (boardWidth / 2) -
            (ballSize / 2);


        ballY =
            STARTING_BALL_Y;


        ballSpeedX = 0;
        ballSpeedY = 0;


        ballElement.style.transform =
            'scale(1)';

        ballElement.classList.remove(
            'ball-explosion-vfx'
        );

        ballElement.style.opacity = 1;


        ballElement.style.left =
            `${ballX}px`;

        ballElement.style.top =
            `${ballY}px`;


        playerX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        opponentX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        updatePaddlePositions();


        const countdownInterval =
            setInterval(() => {

                if (count > 0) {

                    countdownDisplay.textContent =
                        count;

                    playCountdownSound(
                        count
                    );

                    count--;

                } else {

                    clearInterval(
                        countdownInterval
                    );


                    countdownDisplay.textContent =
                        'FOKUS!';

                    playCountdownSound(0);


                    setTimeout(() => {

                        countdownDisplay.style.display =
                            'none';


                        launchBall(
                            directionTo,
                            playerScore
                        );


                        startParticleTrail();


                        lastTimestamp = 0;


                        requestAnimationFrame(
                            gameLoop
                        );

                    }, 500);
                }

            }, 1000);
    }


    // =========================================================
    // TRANSITION AFTER SCORE
    // =========================================================

    function launchTransition(
        directionTo
    ) {

        isGameRunning = false;
        isPaused = true;


        triggerScoreVFX(
            directionTo === 1
        );


        triggerBallExplosion();


        stopParticleTrail();

        resetInputState();


        countdownDisplay.style.display =
            'block';


        setTimeout(() => {

            ballX =
                (boardWidth / 2) -
                (ballSize / 2);

            ballY =
                STARTING_BALL_Y;


            ballElement.style.transform =
                'scale(1)';


            ballElement.classList.remove(
                'ball-explosion-vfx'
            );


            ballElement.style.opacity = 1;


            ballElement.style.left =
                `${ballX}px`;

            ballElement.style.top =
                `${ballY}px`;

        }, 200);


        playerX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        opponentX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        updatePaddlePositions();


        countdownDisplay.textContent =
            '1';


        playCountdownSound(1);


        setTimeout(() => {

            countdownDisplay.textContent =
                'FOKUS!';

            playCountdownSound(0);


            setTimeout(() => {

                countdownDisplay.style.display =
                    'none';


                const currentScore =
                    directionTo === 1
                        ? playerScore
                        : opponentScore;


                launchBall(
                    directionTo,
                    currentScore
                );


                startParticleTrail();


                lastTimestamp = 0;


                requestAnimationFrame(
                    gameLoop
                );

            }, 500);

        }, 1000);
    }


    // =========================================================
    // LAUNCH BALL
    // =========================================================

    function launchBall(
        directionTo,
        scoringPlayerScore
    ) {

        ballSpeedY =
            initialBallSpeed *
            directionTo;


        let horizontalDirection;


        if (
            scoringPlayerScore % 2 === 0
        ) {

            horizontalDirection = 1;

        } else {

            horizontalDirection = -1;
        }


        ballSpeedX =
            horizontalDirection *
            initialBallSpeed *
            (
                Math.random() *
                0.5 +
                0.5
            );


        const currentSpeed =
            Math.sqrt(
                ballSpeedX ** 2 +
                ballSpeedY ** 2
            );


        if (
            currentSpeed >
            initialBallSpeed * 1.05
        ) {

            const ratio =
                initialBallSpeed /
                currentSpeed;


            ballSpeedX *= ratio;
            ballSpeedY *= ratio;
        }


        isPaused = false;
        isGameRunning = true;

        lastTimestamp = 0;
    }


    // =========================================================
    // RESET GAME
    // =========================================================

    function resetGame() {

        initAudio();


        isGameRunning = false;
        isPaused = true;


        playerScore = 0;
        opponentScore = 0;


        playerScoreElement.textContent =
            `PLAYER (Kamu): ${playerScore}`;


        opponentScoreElement.textContent =
            `STRES (Musuh): ${opponentScore}`;


        opponentSpeedMultiplier = 1.0;


        gameMessage.style.display =
            'none';


        playerX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        opponentX =
            (boardWidth / 2) -
            (paddleWidth / 2);


        updatePaddlePositions();


        resetInputState();


        particleContainer.innerHTML =
            '';


        stopParticleTrail();


        startCountdown(1);
    }


    // =========================================================
    // RESPONSIVE POSITION
    // =========================================================

    function getScale() {

        return gameBoard.clientWidth /
            boardWidth;
    }


    function updatePaddlePositions() {

        const scale =
            getScale();


        bottomPaddle.style.left =
            `${playerX * scale}px`;


        topPaddle.style.left =
            `${opponentX * scale}px`;
    }


    // =========================================================
    // PLAYER UPDATE
    // =========================================================

    function updatePlayer(deltaTime) {

        let actualSpeed =
            FIXED_PADDLE_SPEED *
            deltaTime /
            1000;


        if (keys['ArrowLeft']) {

            playerX -= actualSpeed;
        }


        if (keys['ArrowRight']) {

            playerX += actualSpeed;
        }


        if (playerX < 0) {

            playerX = 0;
        }


        if (
            playerX >
            boardWidth -
            paddleWidth
        ) {

            playerX =
                boardWidth -
                paddleWidth;
        }


        const scale =
            getScale();


        bottomPaddle.style.left =
            `${playerX * scale}px`;
    }


    // =========================================================
    // AI UPDATE
    // =========================================================

    function updateOpponent(deltaTime) {

        const opponentCenter =
            opponentX +
            paddleWidth / 2;


        const ballCenter =
            ballX +
            ballSize / 2;


        const baseAISpeed =
            initialBallSpeed * 0.98;


        const aiSpeed =
            baseAISpeed *
            opponentSpeedMultiplier *
            deltaTime /
            1000;


        const margin = 2;


        if (ballSpeedY < 0) {

            if (
                ballCenter <
                opponentCenter -
                margin
            ) {

                opponentX -= aiSpeed;

            } else if (
                ballCenter >
                opponentCenter +
                margin
            ) {

                opponentX += aiSpeed;
            }
        }


        if (opponentX < 0) {

            opponentX = 0;
        }


        if (
            opponentX >
            boardWidth -
            paddleWidth
        ) {

            opponentX =
                boardWidth -
                paddleWidth;
        }


        const scale =
            getScale();


        topPaddle.style.left =
            `${opponentX * scale}px`;
    }


    // =========================================================
    // BALL UPDATE
    // =========================================================

    function updateBall(deltaTime) {

        const moveX =
            ballSpeedX *
            deltaTime /
            1000;


        const moveY =
            ballSpeedY *
            deltaTime /
            1000;


        ballX += moveX;
        ballY += moveY;


        // -----------------------------------------------------
        // WALL COLLISION
        // -----------------------------------------------------

        if (
            ballX < 0 ||
            ballX >
            boardWidth -
            ballSize
        ) {

            playWallSound();


            ballSpeedX *= -1;


            ballX =
                ballX < 0
                    ? 0
                    : boardWidth -
                      ballSize;
        }


        // -----------------------------------------------------
        // PLAYER PADDLE
        // -----------------------------------------------------

        const playerPaddleTop =
            boardHeight -
            20 -
            paddleHeight;


        const playerPaddleBottom =
            playerPaddleTop +
            paddleHeight;


        if (
            ballY +
            ballSize >=
            playerPaddleTop &&

            ballSpeedY > 0 &&

            ballY <
            playerPaddleBottom
        ) {

            if (
                ballX +
                ballSize >
                playerX &&

                ballX <
                playerX +
                paddleWidth
            ) {

                triggerPaddleVFX(
                    bottomPaddle,
                    'paddle-bounce-focus'
                );


                playPaddleSound();


                ballSpeedY *= -1;


                const hitPoint =
                    (
                        ballX +
                        ballSize / 2
                    ) -
                    (
                        playerX +
                        paddleWidth / 2
                    );


                ballSpeedX +=
                    hitPoint * 10;


                ballSpeedX *= 1.075;
                ballSpeedY *= 1.075;


                ballY =
                    playerPaddleTop -
                    ballSize;


                return;
            }
        }


        // -----------------------------------------------------
        // AI PADDLE
        // -----------------------------------------------------

        const topPaddleTop = 20;

        const topPaddleBottom =
            topPaddleTop +
            paddleHeight;


        if (
            ballY <=
            topPaddleBottom &&

            ballSpeedY < 0
        ) {

            if (
                ballX +
                ballSize >
                opponentX &&

                ballX <
                opponentX +
                paddleWidth
            ) {

                triggerPaddleVFX(
                    topPaddle,
                    'paddle-bounce-stress'
                );


                playPaddleSound();


                ballSpeedY *= -1;


                const hitPoint =
                    (
                        ballX +
                        ballSize / 2
                    ) -
                    (
                        opponentX +
                        paddleWidth / 2
                    );


                ballSpeedX +=
                    hitPoint * 10;


                ballSpeedX *= 1.075;
                ballSpeedY *= 1.075;


                ballY =
                    topPaddleBottom;


                return;
            }
        }


        // -----------------------------------------------------
        // PLAYER SCORE
        // -----------------------------------------------------

        if (ballY < 0) {

            playerScore++;


            playScoreSound(true);


            playerScoreElement.textContent =
                `PLAYER (Kamu): ${playerScore}`;


            opponentSpeedMultiplier +=
                SPEED_INCREMENT_PER_POINT;


            if (
                playerScore >= maxScore
            ) {

                gameOver(
                    `PLAYER berhasil mengalahkan STRES!`
                );

            } else {

                launchTransition(1);
            }


            return;
        }


        // -----------------------------------------------------
        // STRES SCORE
        // -----------------------------------------------------

        if (
            ballY >
            boardHeight -
            ballSize
        ) {

            opponentScore++;


            playScoreSound(false);


            opponentScoreElement.textContent =
                `STRES (Musuh): ${opponentScore}`;


            if (
                opponentScore >= maxScore
            ) {

                gameOver(
                    `STRES telah menguasai!`
                );

            } else {

                launchTransition(-1);
            }


            return;
        }


        // -----------------------------------------------------
        // MAX BALL SPEED
        // -----------------------------------------------------

        const currentSpeed =
            Math.sqrt(
                ballSpeedX ** 2 +
                ballSpeedY ** 2
            );


        const maxSpeed =
            2.0 *
            initialBallSpeed;


        if (
            currentSpeed >
            maxSpeed
        ) {

            const ratio =
                maxSpeed /
                currentSpeed;


            ballSpeedX *= ratio;
            ballSpeedY *= ratio;
        }


        // -----------------------------------------------------
        // BALL POSITION
        // -----------------------------------------------------

        const scale =
            getScale();


        ballElement.style.left =
            `${ballX * scale}px`;


        ballElement.style.top =
            `${ballY * scale}px`;
    }


    // =========================================================
    // GAME OVER
    // =========================================================

    function gameOver(message) {

        isGameRunning = false;


        stopParticleTrail();


        const playerWon =
            message.includes(
                "mengalahkan"
            );


        const finalMessageText =
            playerWon
                ? "✨ KEMENANGAN FOKUS! ✨"
                : "🚨 DIKUASAI STRES! 🚨";


        messageText.textContent =
            finalMessageText;


        finalScore.textContent =
            `PLAYER ${playerScore} - ${opponentScore} STRES`;


        gameMessage.style.display =
            'flex';


        playGameOverSound(
            playerWon
        );
    }


    // =========================================================
    // GAME LOOP
    // =========================================================

    function gameLoop(timestamp) {

        if (
            !isGameRunning ||
            isPaused
        ) {

            requestAnimationFrame(
                gameLoop
            );

            return;
        }


        if (lastTimestamp === 0) {

            lastTimestamp =
                timestamp;
        }


        let deltaTime =
            timestamp -
            lastTimestamp;


        lastTimestamp =
            timestamp;


        // Hindari lonjakan besar
        if (
            deltaTime > 50
        ) {

            deltaTime = 50;
        }


        updatePlayer(
            deltaTime
        );


        updateOpponent(
            deltaTime
        );


        updateBall(
            deltaTime
        );


        updatePaddleTrail();


        updateBallVFX();


        requestAnimationFrame(
            gameLoop
        );
    }


    // =========================================================
    // HANDLE RESIZE
    // =========================================================

    window.addEventListener(
        'resize',
        () => {

            updatePaddlePositions();

        }
    );


    // =========================================================
    // START GAME
    // =========================================================

    resetGame();

</script>
