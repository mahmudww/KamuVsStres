<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PLAYER vs. STRES: The Mental Ping Pong</title>

<style>
:root {
    --color-bg-dark: #161625;
    --color-bg-light: #202035;
    --color-focus: #4ecdc4;
    --color-stress: #ff6b6b;
    --color-ball: #ffee00;
    --color-text: #66fcf1;
}

/* =========================
   ANIMASI
========================= */

@keyframes pulse {
    0% {
        opacity: 0.45;
        box-shadow: 0 0 4px var(--color-text);
    }

    50% {
        opacity: 1;
        box-shadow: 0 0 12px var(--color-text);
    }

    100% {
        opacity: 0.45;
        box-shadow: 0 0 4px var(--color-text);
    }
}

@keyframes shake {
    0%   { transform: translate3d(1px, 1px, 0); }
    25%  { transform: translate3d(-2px, -2px, 0); }
    50%  { transform: translate3d(-3px, 0, 0); }
    75%  { transform: translate3d(3px, 2px, 0); }
    100% { transform: translate3d(1px, 1px, 0); }
}

/* =========================
   BODY
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-height: 100dvh;

    background: var(--color-bg-dark);
    color: var(--color-text);

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    overflow: hidden;

    touch-action: none;
    overscroll-behavior: none;
}

/* =========================
   WRAPPER
========================= */

#game-wrapper {
    width: min(94vw, 506px);

    display: flex;
    flex-direction: column;
    align-items: center;

    flex-shrink: 1;
}

/* =========================
   INFO BAR
========================= */

#info-bar {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
    padding: 9px 14px;

    background: var(--color-bg-light);

    border-radius: 12px;

    font-size: clamp(0.72rem, 2.7vw, 1rem);
    font-weight: bold;

    box-shadow:
        -3px -3px 7px rgba(45, 45, 60, 0.35),
        3px 3px 7px rgba(0, 0, 0, 0.7);

    white-space: nowrap;
}

/* =========================
   GAME BOARD
========================= */

#game-board {
    /*
        Physics internal:
        500 x 700

        Visual:
        otomatis mengecil mengikuti HP.
    */

    width: min(94vw, 500px);

    aspect-ratio: 5 / 7;

    border: 3px solid var(--color-text);

    background: var(--color-bg-dark);

    position: relative;

    overflow: hidden;

    border-radius: 10px;

    box-shadow:
        inset 3px 3px 12px rgba(0, 0, 0, 0.75),
        inset -3px -3px 12px rgba(45, 45, 60, 0.3),
        0 0 25px rgba(102, 252, 241, 0.18);

    transform: translateZ(0);

    contain: layout paint;
}

/*
    Semua object game memakai koordinat virtual 500x700.
    Board akan scale secara visual.
*/

#game-world {
    position: absolute;

    left: 0;
    top: 0;

    width: 500px;
    height: 700px;

    transform-origin: top left;

    will-change: transform;

    contain: layout paint;
}

/* =========================
   SCORE VFX
========================= */

.score-focus-vfx {
    background-color: #0c3330 !important;
    border-color: var(--color-focus) !important;
}

.score-stress-vfx {
    background-color: #3b1212 !important;
    border-color: var(--color-stress) !important;
}

.board-shake {
    animation:
        shake 0.18s cubic-bezier(.36,.07,.19,.97) both;
}

/* =========================
   CENTER LINE
========================= */

#center-line {
    position: absolute;

    top: 50%;
    left: 0;

    width: 500px;
    height: 2px;

    background-color: rgba(102, 252, 241, 0.45);

    transform: translateY(-50%);

    z-index: 5;

    animation: pulse 2.5s infinite alternate;
}

/* =========================
   PADDLE
========================= */

#top-paddle,
#bottom-paddle {
    position: absolute;

    width: 80px;
    height: 15px;

    border-radius: 5px;

    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 11px;
    font-weight: bold;

    color: var(--color-bg-dark);

    will-change: transform, left;

    transform: translateZ(0);
}

#top-paddle {
    top: 20px;
    left: 210px;

    background: var(--color-stress);

    box-shadow:
        0 0 8px rgba(255, 107, 107, 0.45);
}

#bottom-paddle {
    bottom: 20px;
    left: 210px;

    background: var(--color-focus);

    box-shadow:
        0 0 8px rgba(78, 205, 196, 0.45);
}

/* Bounce */

.paddle-bounce-stress {
    background: var(--color-ball) !important;
    transform: translateY(5px) translateZ(0);
}

.paddle-bounce-focus {
    background: var(--color-ball) !important;
    transform: translateY(-5px) translateZ(0);
}

/* Trail */

.paddle-trail-stress {
    box-shadow:
        0 0 14px rgba(255, 107, 107, 0.9) !important;
}

.paddle-trail-focus {
    box-shadow:
        0 0 14px rgba(78, 205, 196, 0.9) !important;
}

/* Afterglow */

.paddle-afterglow-stress {
    box-shadow:
        0 0 25px var(--color-ball),
        0 0 10px var(--color-stress) !important;
}

.paddle-afterglow-focus {
    box-shadow:
        0 0 25px var(--color-ball),
        0 0 10px var(--color-focus) !important;
}

/* =========================
   BALL
========================= */

#ball {
    position: absolute;

    width: 15px;
    height: 15px;

    background: var(--color-ball);

    border-radius: 50%;

    z-index: 100;

    /*
        Hindari transition pada posisi.
        Physics menggunakan requestAnimationFrame.
    */

    will-change: left, top;

    transform: translateZ(0);

    box-shadow:
        0 0 7px var(--color-ball);
}

.ball-explosion-vfx {
    transform: scale(2.7) translateZ(0);
    opacity: 0;
}

/* =========================
   PARTICLE
========================= */

#particle-container {
    position: absolute;

    left: 0;
    top: 0;

    width: 500px;
    height: 700px;

    pointer-events: none;

    z-index: 90;

    overflow: hidden;

    contain: strict;
}

.particle {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: var(--color-ball);

    opacity: 0.7;

    will-change:
        transform,
        opacity;

    transform:
        translate3d(0, 0, 0)
        scale(1);

    box-shadow:
        0 0 4px var(--color-ball);
}

/* =========================
   COUNTDOWN
========================= */

#countdown-display {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: var(--color-ball);

    font-size: 80px;

    font-weight: bold;

    text-shadow:
        0 0 15px var(--color-ball);

    z-index: 300;

    display: none;

    pointer-events: none;
}

/* =========================
   GAME MESSAGE
========================= */

#game-message {
    position: absolute;

    top: 0;
    left: 0;

    width: 500px;
    height: 700px;

    background:
        rgba(0, 0, 0, 0.88);

    color: white;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;

    font-size: 28px;

    text-align: center;

    z-index: 200;

    text-shadow:
        0 0 15px rgba(78, 205, 196, 0.7);
}

#message-text {
    max-width: 440px;
}

#final-score {
    margin-top: 8px;
}

#game-message button {
    padding: 12px 22px;

    margin-top: 22px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    background: var(--color-focus);

    color: var(--color-bg-dark);

    border: none;

    border-radius: 12px;

    box-shadow:
        0 0 12px rgba(78, 205, 196, 0.5);

    touch-action: manipulation;
}

#game-message button:active {
    transform: scale(0.97);
}

/* =========================
   TOUCH CONTROL
========================= */

#touch-controls {
    width: 100%;

    display: flex;
    justify-content: space-between;

    gap: 10px;

    margin-top: 10px;
}

.touch-button {
    flex: 1;

    min-width: 0;

    padding: 12px 5px;

    background: var(--color-bg-light);

    color: var(--color-focus);

    font-weight: bold;

    text-align: center;

    border-radius: 12px;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;

    box-shadow:
        -3px -3px 7px rgba(45, 45, 60, 0.35),
        3px 3px 7px rgba(0, 0, 0, 0.7),
        0 0 5px rgba(78, 205, 196, 0.35);
}

.touch-button.active {
    background: var(--color-focus);

    color: var(--color-bg-dark);

    box-shadow:
        inset 2px 2px 5px rgba(0, 0, 0, 0.7);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #game-wrapper {
        width: 94vw;
    }

    #info-bar {
        margin-bottom: 7px;
        padding: 7px 10px;

        font-size: clamp(
            0.65rem,
            2.8vw,
            0.9rem
        );
    }

    #game-board {
        width: 94vw;
    }

    #touch-controls {
        margin-top: 7px;
    }

    .touch-button {
        padding: 10px 3px;
        font-size: 0.85rem;
    }
}

/* HP pendek / landscape */

@media (max-height: 650px) {

    #game-wrapper {
        transform: scale(
            min(
                1,
                calc(100dvh / 750)
            )
        );
    }
}

/* Kurangi animasi kalau device minta reduced motion */

@media (prefers-reduced-motion: reduce) {

    #center-line {
        animation: none;
    }

    .board-shake {
        animation: none;
    }
}
</style>
</head>

<body>

<div id="game-wrapper">

    <div id="info-bar">
        <div id="player-score">
            PLAYER (Kamu): 0
        </div>

        <div id="opponent-score">
            STRES (Musuh): 0
        </div>
    </div>


    <div id="game-board">

        <!--
            WORLD = koordinat physics 500 x 700
        -->
        <div id="game-world">

            <div id="center-line"></div>

            <div id="top-paddle">
                STRES
            </div>

            <div id="ball"></div>

            <div id="bottom-paddle">
                PLAYER
            </div>

            <div id="particle-container"></div>

            <div id="countdown-display"></div>

            <div id="game-message">

                <div id="message-text"></div>

                <div id="final-score"></div>

                <button id="retry-button">
                    COBA LAGI
                </button>

            </div>

        </div>

    </div>


    <div id="touch-controls">

        <div
            class="touch-button"
            id="left-button">
            KIRI (◀)
        </div>

        <div
            class="touch-button"
            id="right-button">
            KANAN (▶)
        </div>

    </div>

</div>


<script>

/* =========================================================
   DOM
========================================================= */

const gameBoard =
    document.getElementById('game-board');

const gameWorld =
    document.getElementById('game-world');

const bottomPaddle =
    document.getElementById('bottom-paddle');

const topPaddle =
    document.getElementById('top-paddle');

const ballElement =
    document.getElementById('ball');

const particleContainer =
    document.getElementById('particle-container');

const playerScoreElement =
    document.getElementById('player-score');

const opponentScoreElement =
    document.getElementById('opponent-score');

const gameMessage =
    document.getElementById('game-message');

const messageText =
    document.getElementById('message-text');

const finalScore =
    document.getElementById('final-score');

const countdownDisplay =
    document.getElementById('countdown-display');

const leftButton =
    document.getElementById('left-button');

const rightButton =
    document.getElementById('right-button');

const retryButton =
    document.getElementById('retry-button');


/* =========================================================
   VIRTUAL GAME SIZE
========================================================= */

const boardWidth = 500;
const boardHeight = 700;

const paddleWidth = 80;
const paddleHeight = 15;

const ballSize = 15;

const STARTING_BALL_Y =
    (boardHeight / 3) -
    (ballSize / 3);


/* =========================================================
   GAME STATE
========================================================= */

let playerX =
    (boardWidth / 2) -
    (paddleWidth / 2);

let opponentX =
    (boardWidth / 2) -
    (paddleWidth / 2);

const FIXED_PADDLE_SPEED = 800;

let keys = {
    ArrowLeft: false,
    ArrowRight: false
};


/* =========================================================
   BALL
========================================================= */

let ballX = 0;
let ballY = 0;

let ballSpeedX = 0;
let ballSpeedY = 0;

const initialBallSpeed = 500;


/* =========================================================
   SCORE
========================================================= */

let playerScore = 0;
let opponentScore = 0;

const maxScore = 5;


/* =========================================================
   AI
========================================================= */

let opponentSpeedMultiplier = 1;

const SPEED_INCREMENT_PER_POINT = 0.15;


/* =========================================================
   GAME CONTROL
========================================================= */

let isGameRunning = false;
let isPaused = true;

let lastTimestamp = 0;

let animationFrameId = null;

let countdownTimer = null;
let transitionTimers = [];


/* =========================================================
   PARTICLE POOL
=========================================================

   Versi lama:
   createElement() setiap 30ms.

   Versi baru:
   particle dibuat sekali,
   lalu dipakai ulang.

   Ini jauh lebih ramah HP.
========================================================= */

const MAX_PARTICLES = 18;

const particles = [];

for (let i = 0; i < MAX_PARTICLES; i++) {

    const p =
        document.createElement('div');

    p.className = 'particle';

    p.style.display = 'none';

    particleContainer.appendChild(p);

    particles.push({
        element: p,
        active: false,
        life: 0,
        maxLife: 0
    });
}

let particleIndex = 0;

let lastParticleTime = 0;

const PARTICLE_INTERVAL = 55;


/* =========================================================
   RESPONSIVE SCALE
========================================================= */

function resizeGame() {

    const boardRect =
        gameBoard.getBoundingClientRect();

    const scale =
        boardRect.width / boardWidth;

    gameWorld.style.transform =
        `scale(${scale})`;
}


/* Jalankan sekali */

resizeGame();


/* Update ketika HP di-rotate / resize */

window.addEventListener(
    'resize',
    resizeGame,
    { passive: true }
);


/* =========================================================
   INPUT RESET
========================================================= */

function resetInputState() {

    keys.ArrowLeft = false;
    keys.ArrowRight = false;

    leftButton.classList.remove('active');
    rightButton.classList.remove('active');

    bottomPaddle.classList.remove(
        'paddle-trail-focus'
    );

    topPaddle.classList.remove(
        'paddle-trail-stress'
    );
}


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

function spawnParticle(timestamp) {

    if (
        !isGameRunning ||
        isPaused
    ) {
        return;
    }

    if (
        timestamp - lastParticleTime <
        PARTICLE_INTERVAL
    ) {
        return;
    }

    lastParticleTime = timestamp;

    const particle =
        particles[particleIndex];

    particleIndex =
        (particleIndex + 1) %
        MAX_PARTICLES;

    const p =
        particle.element;

    const size =
        2 + Math.random() * 2;

    p.style.display = 'block';

    p.style.width =
        `${size}px`;

    p.style.height =
        `${size}px`;

    p.style.left =
        `${ballX + ballSize / 2}px`;

    p.style.top =
        `${ballY + ballSize / 2}px`;

    p.style.opacity = '0.75';

    p.style.transform =
        'translate3d(-50%, -50%, 0) scale(1)';

    particle.active = true;

    particle.life = 0;

    particle.maxLife = 260;
}


function updateParticles(deltaTime) {

    for (const particle of particles) {

        if (!particle.active) {
            continue;
        }

        particle.life += deltaTime;

        const progress =
            particle.life /
            particle.maxLife;

        if (progress >= 1) {

            particle.active = false;

            particle.element.style.display =
                'none';

            continue;
        }

        const opacity =
            0.75 *
            (1 - progress);

        const scale =
            1 - progress * 0.7;

        particle.element.style.opacity =
            opacity;

        particle.element.style.transform =
            `translate3d(-50%, -50%, 0) scale(${scale})`;
    }
}


function clearParticles() {

    for (const particle of particles) {

        particle.active = false;

        particle.element.style.display =
            'none';
    }
}


/* =========================================================
   PADDLE VFX
========================================================= */

function triggerPaddleVFX(
    paddleElement,
    vfxClass
) {

    const afterglowClass =
        vfxClass.includes('focus')
            ? 'paddle-afterglow-focus'
            : 'paddle-afterglow-stress';

    paddleElement.classList.add(vfxClass);

    paddleElement.classList.add(
        afterglowClass
    );

    const t1 =
        setTimeout(() => {

            paddleElement.classList.remove(
                vfxClass
            );

        }, 90);

    const t2 =
        setTimeout(() => {

            paddleElement.classList.remove(
                afterglowClass
            );

        }, 180);

    transitionTimers.push(t1, t2);
}


/* =========================================================
   SCORE VFX
========================================================= */

function triggerScoreVFX(
    isPlayerScore
) {

    const vfxClass =
        isPlayerScore
            ? 'score-focus-vfx'
            : 'score-stress-vfx';

    gameBoard.classList.add(
        vfxClass
    );

    gameBoard.classList.add(
        'board-shake'
    );

    const timer =
        setTimeout(() => {

            gameBoard.classList.remove(
                vfxClass
            );

            gameBoard.classList.remove(
                'board-shake'
            );

        }, 300);

    transitionTimers.push(timer);
}


/* =========================================================
   BALL EXPLOSION
========================================================= */

function triggerBallExplosion() {

    ballElement.classList.add(
        'ball-explosion-vfx'
    );

    const timer =
        setTimeout(() => {

            ballElement.classList.remove(
                'ball-explosion-vfx'
            );

        }, 220);

    transitionTimers.push(timer);
}


/* =========================================================
   PADDLE TRAIL
========================================================= */

function updatePaddleTrail() {

    const playerMoving =
        keys.ArrowLeft ||
        keys.ArrowRight;

    if (playerMoving) {

        bottomPaddle.classList.add(
            'paddle-trail-focus'
        );

    } else {

        bottomPaddle.classList.remove(
            'paddle-trail-focus'
        );
    }


    const isAITurn =
        ballSpeedY < 0;

    const isAIPursuing =
        Math.abs(
            ballX +
            ballSize / 2 -
            (
                opponentX +
                paddleWidth / 2
            )
        ) > 5;

    if (
        isAITurn &&
        isAIPursuing
    ) {

        topPaddle.classList.add(
            'paddle-trail-stress'
        );

    } else {

        topPaddle.classList.remove(
            'paddle-trail-stress'
        );
    }
}


/* =========================================================
   INPUT
========================================================= */

function setMovement(
    key,
    value
) {

    if (
        !isGameRunning ||
        isPaused
    ) {
        return;
    }

    keys[key] = value;
}


/* Keyboard */

document.addEventListener(
    'keydown',
    (e) => {

        const key =
            e.key.toLowerCase();

        if (
            e.key === 'ArrowLeft' ||
            key === 'a'
        ) {

            setMovement(
                'ArrowLeft',
                true
            );

            e.preventDefault();

        } else if (
            e.key === 'ArrowRight' ||
            key === 'd'
        ) {

            setMovement(
                'ArrowRight',
                true
            );

            e.preventDefault();
        }
    }
);


document.addEventListener(
    'keyup',
    (e) => {

        const key =
            e.key.toLowerCase();

        if (
            e.key === 'ArrowLeft' ||
            key === 'a'
        ) {

            keys.ArrowLeft = false;

        } else if (
            e.key === 'ArrowRight' ||
            key === 'd'
        ) {

            keys.ArrowRight = false;
        }
    }
);


/* =========================================================
   TOUCH CONTROL
========================================================= */

function startMoveLeft(e) {

    e.preventDefault();

    leftButton.classList.add('active');

    setMovement(
        'ArrowLeft',
        true
    );
}


function startMoveRight(e) {

    e.preventDefault();

    rightButton.classList.add('active');

    setMovement(
        'ArrowRight',
        true
    );
}


function stopMove(e) {

    if (e) {
        e.preventDefault();
    }

    keys.ArrowLeft = false;
    keys.ArrowRight = false;

    leftButton.classList.remove(
        'active'
    );

    rightButton.classList.remove(
        'active'
    );
}


/*
    Pointer Events lebih simpel
    daripada kombinasi mouse + touch.
*/

leftButton.addEventListener(
    'pointerdown',
    startMoveLeft
);

rightButton.addEventListener(
    'pointerdown',
    startMoveRight
);

leftButton.addEventListener(
    'pointerup',
    stopMove
);

rightButton.addEventListener(
    'pointerup',
    stopMove
);

leftButton.addEventListener(
    'pointercancel',
    stopMove
);

rightButton.addEventListener(
    'pointercancel',
    stopMove
);

leftButton.addEventListener(
    'pointerleave',
    stopMove
);

rightButton.addEventListener(
    'pointerleave',
    stopMove
);


/* =========================================================
   COUNTDOWN
========================================================= */

function clearAllTimers() {

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

        countdownTimer = null;
    }

    for (
        const timer of transitionTimers
    ) {

        clearTimeout(timer);
    }

    transitionTimers = [];
}


function startCountdown(
    directionTo
) {

    clearAllTimers();

    isGameRunning = false;
    isPaused = true;

    resetInputState();
    clearParticles();

    countdownDisplay.style.display =
        'block';

    let count = 3;


    /* Reset bola */

    ballX =
        boardWidth / 2 -
        ballSize / 2;

    ballY =
        STARTING_BALL_Y;

    ballSpeedX = 0;
    ballSpeedY = 0;


    ballElement.style.opacity =
        '1';

    ballElement.style.transform =
        'translateZ(0)';

    updateBallPosition();


    /* Reset paddle */

    resetPaddles();


    countdownDisplay.textContent =
        count;


    countdownTimer =
        setInterval(() => {

            count--;

            if (count > 0) {

                countdownDisplay.textContent =
                    count;

            } else {

                clearInterval(
                    countdownTimer
                );

                countdownTimer = null;

                countdownDisplay.textContent =
                    'FOKUS!';


                const timer =
                    setTimeout(() => {

                        countdownDisplay.style.display =
                            'none';

                        launchBall(
                            directionTo,
                            playerScore
                        );

                        lastTimestamp = 0;

                        startGameLoop();

                    }, 450);

                transitionTimers.push(
                    timer
                );
            }

        }, 700);
}


/* =========================================================
   SCORE TRANSITION
========================================================= */

function launchTransition(
    directionTo
) {

    isGameRunning = false;
    isPaused = true;

    resetInputState();
    clearParticles();

    triggerScoreVFX(
        directionTo === 1
    );

    triggerBallExplosion();

    countdownDisplay.style.display =
        'block';

    countdownDisplay.textContent =
        '1';


    const resetTimer =
        setTimeout(() => {

            ballX =
                boardWidth / 2 -
                ballSize / 2;

            ballY =
                STARTING_BALL_Y;

            ballSpeedX = 0;
            ballSpeedY = 0;

            ballElement.style.opacity =
                '1';

            ballElement.style.transform =
                'translateZ(0)';

            updateBallPosition();

        }, 180);

    transitionTimers.push(
        resetTimer
    );


    resetPaddles();


    const focusTimer =
        setTimeout(() => {

            countdownDisplay.textContent =
                'FOKUS!';

        }, 600);

    transitionTimers.push(
        focusTimer
    );


    const startTimer =
        setTimeout(() => {

            countdownDisplay.style.display =
                'none';

            const currentScore =
                directionTo === 1
                    ? playerScore
                    : opponentScore;

            launchBall(
                directionTo,
                currentScore
            );

            lastTimestamp = 0;

            startGameLoop();

        }, 1050);

    transitionTimers.push(
        startTimer
    );
}


/* =========================================================
   LAUNCH BALL
========================================================= */

function launchBall(
    directionTo,
    scoringPlayerScore
) {

    ballSpeedY =
        initialBallSpeed *
        directionTo;


    let horizontalDirection;

    if (
        scoringPlayerScore % 2 === 0
    ) {

        horizontalDirection = 1;

    } else {

        horizontalDirection = -1;
    }


    ballSpeedX =
        horizontalDirection *
        initialBallSpeed *
        (
            Math.random() *
            0.5 +
            0.5
        );


    const currentSpeed =
        Math.hypot(
            ballSpeedX,
            ballSpeedY
        );


    if (
        currentSpeed >
        initialBallSpeed * 1.05
    ) {

        const ratio =
            initialBallSpeed /
            currentSpeed;

        ballSpeedX *= ratio;
        ballSpeedY *= ratio;
    }


    isPaused = false;
    isGameRunning = true;

    lastTimestamp = 0;
}


/* =========================================================
   RESET PADDLES
========================================================= */

function resetPaddles() {

    playerX =
        boardWidth / 2 -
        paddleWidth / 2;

    opponentX =
        boardWidth / 2 -
        paddleWidth / 2;

    updatePaddlePositions();
}


function updatePaddlePositions() {

    bottomPaddle.style.left =
        `${playerX}px`;

    topPaddle.style.left =
        `${opponentX}px`;
}


/* =========================================================
   BALL POSITION
========================================================= */

function updateBallPosition() {

    /*
        Gunakan left/top langsung.
        Tidak memakai transition.
    */

    ballElement.style.left =
        `${ballX}px`;

    ballElement.style.top =
        `${ballY}px`;
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    deltaTime
) {

    const actualSpeed =
        FIXED_PADDLE_SPEED *
        deltaTime /
        1000;


    if (keys.ArrowLeft) {

        playerX -= actualSpeed;
    }


    if (keys.ArrowRight) {

        playerX += actualSpeed;
    }


    if (playerX < 0) {

        playerX = 0;
    }


    if (
        playerX >
        boardWidth - paddleWidth
    ) {

        playerX =
            boardWidth -
            paddleWidth;
    }


    bottomPaddle.style.left =
        `${playerX}px`;
}


/* =========================================================
   AI UPDATE
========================================================= */

function updateOpponent(
    deltaTime
) {

    const opponentCenter =
        opponentX +
        paddleWidth / 2;

    const ballCenter =
        ballX +
        ballSize / 2;


    const baseAISpeed =
        initialBallSpeed *
        0.98;

    const aiSpeed =
        baseAISpeed *
        opponentSpeedMultiplier *
        deltaTime /
        1000;

    const margin = 2;


    if (
        ballSpeedY < 0
    ) {

        if (
            ballCenter <
            opponentCenter - margin
        ) {

            opponentX -= aiSpeed;

        } else if (
            ballCenter >
            opponentCenter + margin
        ) {

            opponentX += aiSpeed;
        }
    }


    if (opponentX < 0) {

        opponentX = 0;
    }


    if (
        opponentX >
        boardWidth - paddleWidth
    ) {

        opponentX =
            boardWidth -
            paddleWidth;
    }


    topPaddle.style.left =
        `${opponentX}px`;
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(
    deltaTime
) {

    const moveX =
        ballSpeedX *
        deltaTime /
        1000;

    const moveY =
        ballSpeedY *
        deltaTime /
        1000;


    ballX += moveX;
    ballY += moveY;


    /* -------------------------
       DINDING KIRI / KANAN
    ------------------------- */

    if (
        ballX < 0 ||
        ballX >
        boardWidth - ballSize
    ) {

        ballSpeedX *= -1;

        ballX =
            ballX < 0
                ? 0
                : boardWidth - ballSize;
    }


    /* -------------------------
       PADDLE PLAYER
    ------------------------- */

    const playerPaddleTop =
        boardHeight -
        20 -
        paddleHeight;


    if (
        ballY + ballSize >=
        playerPaddleTop &&

        ballSpeedY > 0 &&

        ballY <
        playerPaddleTop +
        paddleHeight
    ) {

        if (
            ballX + ballSize >
            playerX &&

            ballX <
            playerX +
            paddleWidth
        ) {

            triggerPaddleVFX(
                bottomPaddle,
                'paddle-bounce-focus'
            );


            ballSpeedY *= -1;


            const hitPoint =
                (
                    ballX +
                    ballSize / 2
                ) -
                (
                    playerX +
                    paddleWidth / 2
                );


            ballSpeedX +=
                hitPoint * 10;


            ballSpeedX *= 1.075;
            ballSpeedY *= 1.075;


            ballY =
                playerPaddleTop -
                ballSize;


            return;
        }
    }


    /* -------------------------
       PADDLE AI
    ------------------------- */

    const topPaddleTop = 20;

    const topPaddleBottom =
        topPaddleTop +
        paddleHeight;


    if (
        ballY <=
        topPaddleBottom &&

        ballSpeedY < 0
    ) {

        if (
            ballX + ballSize >
            opponentX &&

            ballX <
            opponentX +
            paddleWidth
        ) {

            triggerPaddleVFX(
                topPaddle,
                'paddle-bounce-stress'
            );


            ballSpeedY *= -1;


            const hitPoint =
                (
                    ballX +
                    ballSize / 2
                ) -
                (
                    opponentX +
                    paddleWidth / 2
                );


            ballSpeedX +=
                hitPoint * 10;


            ballSpeedX *= 1.075;
            ballSpeedY *= 1.075;


            ballY =
                topPaddleBottom;


            return;
        }
    }


    /* -------------------------
       SKOR PLAYER
    ------------------------- */

    if (
        ballY < 0
    ) {

        playerScore++;


        playerScoreElement.textContent =
            `PLAYER (Kamu): ${playerScore}`;


        opponentSpeedMultiplier +=
            SPEED_INCREMENT_PER_POINT;


        if (
            playerScore >= maxScore
        ) {

            gameOver(
                true
            );

        } else {

            launchTransition(
                1
            );
        }


        return;
    }


    /* -------------------------
       SKOR STRES
    ------------------------- */

    if (
        ballY >
        boardHeight - ballSize
    ) {

        opponentScore++;


        opponentScoreElement.textContent =
            `STRES (Musuh): ${opponentScore}`;


        if (
            opponentScore >= maxScore
        ) {

            gameOver(
                false
            );

        } else {

            launchTransition(
                -1
            );
        }


        return;
    }


    /* -------------------------
       BATAS SPEED
    ------------------------- */

    const currentSpeed =
        Math.hypot(
            ballSpeedX,
            ballSpeedY
        );

    const maxSpeed =
        2 *
        initialBallSpeed;


    if (
        currentSpeed >
        maxSpeed
    ) {

        const ratio =
            maxSpeed /
            currentSpeed;

        ballSpeedX *= ratio;
        ballSpeedY *= ratio;
    }


    updateBallPosition();
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(
    playerWon
) {

    isGameRunning = false;
    isPaused = true;

    resetInputState();

    clearParticles();

    if (playerWon) {

        messageText.textContent =
            '✨ KEMENANGAN FOKUS! ✨';

    } else {

        messageText.textContent =
            '🚨 DIKUASAI STRES! 🚨';
    }


    finalScore.textContent =
        `${playerScore} - ${opponentScore}`;


    gameMessage.style.display =
        'flex';
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    clearAllTimers();

    isGameRunning = false;
    isPaused = true;

    playerScore = 0;
    opponentScore = 0;

    opponentSpeedMultiplier = 1;

    playerScoreElement.textContent =
        `PLAYER (Kamu): 0`;

    opponentScoreElement.textContent =
        `STRES (Musuh): 0`;


    gameMessage.style.display =
        'none';


    ballElement.style.opacity =
        '1';

    ballElement.style.transform =
        'translateZ(0)';


    resetInputState();

    clearParticles();

    resetPaddles();


    startCountdown(1);
}


/* =========================================================
   GAME LOOP
========================================================= */

function startGameLoop() {

    if (
        animationFrameId !== null
    ) {
        cancelAnimationFrame(
            animationFrameId
        );
    }

    lastTimestamp = 0;

    animationFrameId =
        requestAnimationFrame(
            gameLoop
        );
}


function gameLoop(timestamp) {

    if (
        !isGameRunning ||
        isPaused
    ) {

        animationFrameId =
            requestAnimationFrame(
                gameLoop
            );

        return;
    }


    if (
        lastTimestamp === 0
    ) {

        lastTimestamp =
            timestamp;
    }


    let deltaTime =
        timestamp -
        lastTimestamp;


    lastTimestamp =
        timestamp;


    /*
        Kalau HP tiba-tiba freeze
        / pindah tab, jangan biarkan
        bola teleport terlalu jauh.
    */

    if (
        deltaTime > 40
    ) {

        deltaTime = 40;
    }


    /* -------------------------
       GAME PHYSICS
    ------------------------- */

    updatePlayer(
        deltaTime
    );

    updateOpponent(
        deltaTime
    );

    updateBall(
        deltaTime
    );


    /* -------------------------
       VFX
    ------------------------- */

    updatePaddleTrail();

    spawnParticle(timestamp);

    updateParticles(
        deltaTime
    );


    animationFrameId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   RETRY BUTTON
========================================================= */

retryButton.addEventListener(
    'click',
    resetGame
);


/* =========================================================
   INITIALIZE
========================================================= */

resetGame();

</script>
