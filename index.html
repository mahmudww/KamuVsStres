<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAYER vs. STRES: The Mental Ping Pong</title>
    <style>
        :root {
            --color-bg-dark: #0f0f1a;        
            --color-bg-light: #1a1a2e;       
            --color-focus: #00f5d4;          
            --color-stress: #f72585;         
            --color-ball: #4cc9f0;           
            --color-text: #4cc9f0;           
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-2px, -1px) rotate(-0.5deg); }
            50% { transform: translate(-1px, 2px) rotate(0.5deg); }
            75% { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-0.5deg); }
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #09090e 0%, #16162b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden;
            color: var(--color-text);
            touch-action: none;
        }
        
        #info-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 12px 20px;
            box-sizing: border-box;
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 201, 240, 0.2);
            border-radius: 14px;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #game-board {
            width: 100%;
            max-width: 500px;
            height: 60vh;
            max-height: 600px;
            border: 2px solid rgba(76, 201, 240, 0.4);
            background: radial-gradient(circle at center, #131324 0%, #0b0b14 100%);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
            will-change: transform;
        }
        
        .board-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        .score-focus-vfx {
            border-color: var(--color-focus) !important;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.3), inset 0 0 20px rgba(0,0,0,0.5) !important;
        }
        .score-stress-vfx {
            border-color: var(--color-stress) !important;
            box-shadow: 0 0 25px rgba(247, 37, 133, 0.3), inset 0 0 20px rgba(0,0,0,0.5) !important;
        }

        #center-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, rgba(76, 201, 240, 0.4) 0px, rgba(76, 201, 240, 0.4) 10px, transparent 10px, transparent 20px);
            transform: translateY(-50%);
            z-index: 5;
            animation: pulse 3s infinite ease-in-out; 
        }
        
        #top-paddle, #bottom-paddle {
            position: absolute;
            width: 84px;
            height: 16px;
            border-radius: 8px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0b0b14;
            font-size: 0.65em;
            font-weight: 800;
            letter-spacing: 1px;
            will-change: left;
            transition: background-color 0.15s ease;
        }

        #top-paddle {
            top: 15px; 
            background-color: var(--color-stress); 
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
        }

        #bottom-paddle {
            bottom: 15px; 
            background-color: var(--color-focus); 
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.4);
        }
        
        #ball {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, var(--color-ball) 70%);
            border-radius: 50%;
            z-index: 100; 
            box-shadow: 0 0 12px var(--color-ball);
            will-change: transform;
        }
        
        .ball-explosion-vfx {
            transform: scale(2.5);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.25s ease;
        }

        #countdown-display {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); 
            color: #ffffff;
            font-size: 3.5em; 
            font-weight: 900;
            text-shadow: 0 0 20px var(--color-focus);
            z-index: 300;
            display: none; 
        }

        #game-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.3em;
            text-align: center;
            z-index: 200;
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-message button {
            padding: 14px 28px;
            margin-top: 25px;
            font-size: 0.65em;
            cursor: pointer;
            background: linear-gradient(135deg, var(--color-focus) 0%, #039688 100%);
            color: #0b0b14;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3);
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        #game-message button:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        #touch-controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            box-sizing: border-box;
            padding: 0 4px;
        }

        .touch-button {
            width: 48%; 
            padding: 16px 0;
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(76, 201, 240, 0.15);
            color: var(--color-focus);
            font-weight: 700;
            font-size: 0.9em;
            letter-spacing: 1px;
            text-align: center;
            border-radius: 14px;
            cursor: pointer;
            user-select: none; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .touch-button:active {
            background: var(--color-focus);
            color: #0b0b14;
        }
    </style>
</head>
<body>

<div id="info-bar">
    <div id="player-score">PLAYER: 0</div>
    <div id="opponent-score">STRES: 0</div>
</div>

<div id="game-board">
    <div id="center-line"></div>
    <div id="top-paddle">STRES</div>
    <div id="ball"></div>
    <div id="bottom-paddle">PLAYER</div>
    
    <div id="countdown-display"></div>

    <div id="game-message">
        <div id="message-text"></div>
        <div id="final-score"></div>
        <button onclick="resetGame()">COBA LAGI</button>
    </div>
</div>

<div id="touch-controls">
    <div class="touch-button" id="left-button">&#9664; KIRI</div>
    <div class="touch-button" id="right-button">KANAN &#9654;</div>
</div>

<script>
    const gameBoard = document.getElementById('game-board');
    const bottomPaddle = document.getElementById('bottom-paddle');
    const topPaddle = document.getElementById('top-paddle');
    const ballElement = document.getElementById('ball');
    const playerScoreElement = document.getElementById('player-score');
    const opponentScoreElement = document.getElementById('opponent-score');
    const gameMessage = document.getElementById('game-message');
    const messageText = document.getElementById('message-text');
    const countdownDisplay = document.getElementById('countdown-display');
    const leftButton = document.getElementById('left-button');
    const rightButton = document.getElementById('right-button');
    
    let boardWidth = gameBoard.clientWidth;
    let boardHeight = gameBoard.clientHeight;

    window.addEventListener('resize', () => {
        boardWidth = gameBoard.clientWidth;
        boardHeight = gameBoard.clientHeight;
    });

    const paddleWidth = 84;
    const paddleHeight = 16;
    const ballSize = 16;
    const STARTING_BALL_Y = (boardHeight / 3) - (ballSize / 3); 

    let playerX = (boardWidth / 2) - (paddleWidth / 2); 
    let opponentX = (boardWidth / 2) - (paddleWidth / 2); 
    const FIXED_PADDLE_SPEED = 800; 
    let keys = {}; 
    
    let ballX, ballY; 
    let ballSpeedX, ballSpeedY; 
    const initialBallSpeed = 500; 
    
    let playerScore = 0;
    let opponentScore = 0;
    const maxScore = 5; 
    
    let opponentSpeedMultiplier = 1.0; 
    const SPEED_INCREMENT_PER_POINT = 0.15; 
    
    let isGameRunning = false; 
    let isPaused = true;
    let lastTimestamp = 0; 

    function resetInputState() {
        keys['ArrowLeft'] = false;
        keys['ArrowRight'] = false;
    }

    function triggerPaddleVFX(paddleElement, isFocus) {
        paddleElement.style.backgroundColor = '#ffffff';
        setTimeout(() => {
            paddleElement.style.backgroundColor = isFocus ? 'var(--color-focus)' : 'var(--color-stress)';
        }, 120);
    }
    
    function triggerScoreVFX(isPlayerScore) {
        const vfxClass = isPlayerScore ? 'score-focus-vfx' : 'score-stress-vfx';
        gameBoard.classList.add(vfxClass, 'board-shake'); 
        setTimeout(() => {
            gameBoard.classList.remove(vfxClass, 'board-shake'); 
        }, 400); 
    }

    function triggerBallExplosion() {
        ballElement.classList.add('ball-explosion-vfx');
    }

    function setMovement(key, value) {
        if (!isGameRunning || isPaused) return; 
        keys[key] = value;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') setMovement('ArrowLeft', true);
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') setMovement('ArrowRight', true);
        if (e.key.includes('Arrow')) e.preventDefault(); 
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') setMovement('ArrowLeft', false);
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') setMovement('ArrowRight', false);
    });

    function startMoveLeft() { setMovement('ArrowLeft', true); }
    function startMoveRight() { setMovement('ArrowRight', true); }
    function stopMove() { keys['ArrowLeft'] = false; keys['ArrowRight'] = false; }

    leftButton.addEventListener('mousedown', startMoveLeft);
    leftButton.addEventListener('touchstart', (e) => { e.preventDefault(); startMoveLeft(); });
    rightButton.addEventListener('mousedown', startMoveRight);
    rightButton.addEventListener('touchstart', (e) => { e.preventDefault(); startMoveRight(); });

    leftButton.addEventListener('mouseup', stopMove);
    leftButton.addEventListener('touchend', stopMove);
    rightButton.addEventListener('mouseup', stopMove);
    rightButton.addEventListener('touchend', stopMove);
    leftButton.addEventListener('mouseleave', stopMove);
    rightButton.addEventListener('mouseleave', stopMove);

    function startCountdown(directionTo) {
        isGameRunning = false;
        isPaused = true;
        countdownDisplay.style.display = 'block';
        let count = 3;

        resetInputState(); 

        ballX = (boardWidth / 2) - (ballSize / 2);
        ballY = STARTING_BALL_Y; 
        ballSpeedX = 0;
        ballSpeedY = 0;
        
        ballElement.style.transform = 'translate3d(0,0,0) scale(1)'; 
        ballElement.classList.remove('ball-explosion-vfx'); 
        ballElement.style.opacity = 1; 
        ballElement.style.left = `${ballX}px`;
        ballElement.style.top = `${ballY}px`; 
        
        playerX = (boardWidth / 2) - (paddleWidth / 2);
        opponentX = (boardWidth / 2) - (paddleWidth / 2); 
        bottomPaddle.style.left = `${playerX}px`;
        topPaddle.style.left = `${opponentX}px`; 

        const countdownInterval = setInterval(() => {
            if (count > 0) {
                countdownDisplay.textContent = count;
                count--;
            } else {
                clearInterval(countdownInterval);
                countdownDisplay.textContent = 'FOKUS!'; 
                setTimeout(() => {
                    countdownDisplay.style.display = 'none';
                    launchBall(directionTo, playerScore); 
                    lastTimestamp = 0; 
                    requestAnimationFrame(gameLoop);
                }, 500); 
            }
        }, 1000); 
    }
    
    function launchTransition(directionTo) {
        isGameRunning = false;
        isPaused = true; 
        triggerScoreVFX(directionTo === 1); 
        triggerBallExplosion(); 
        resetInputState(); 

        countdownDisplay.style.display = 'block';
        
        setTimeout(() => {
            ballX = (boardWidth / 2) - (ballSize / 2);
            ballY = STARTING_BALL_Y; 
            ballElement.style.transform = 'translate3d(0,0,0) scale(1)';
            ballElement.classList.remove('ball-explosion-vfx');
            ballElement.style.opacity = 1; 
            ballElement.style.left = `${ballX}px`;
            ballElement.style.top = `${ballY}px`;
        }, 200); 

        playerX = (boardWidth / 2) - (paddleWidth / 2);
        opponentX = (boardWidth / 2) - (paddleWidth / 2); 
        bottomPaddle.style.left = `${playerX}px`;
        topPaddle.style.left = `${opponentX}px`; 

        countdownDisplay.textContent = '1';

        setTimeout(() => {
            countdownDisplay.textContent = 'FOKUS!'; 
            setTimeout(() => {
                countdownDisplay.style.display = 'none';
                const currentScore = directionTo === 1 ? playerScore : opponentScore;
                launchBall(directionTo, currentScore); 
                lastTimestamp = 0;
                requestAnimationFrame(gameLoop);
            }, 500); 
        }, 1000); 
    }

    function launchBall(directionTo, scoringPlayerScore) {
        ballSpeedY = initialBallSpeed * directionTo; 
        let horizontalDirection = (scoringPlayerScore % 2 === 0) ? 1 : -1; 
        ballSpeedX = horizontalDirection * initialBallSpeed * (Math.random() * 0.5 + 0.5); 
        
        isPaused = false;
        isGameRunning = true;
        lastTimestamp = 0; 
    }

    function resetGame() {
        boardWidth = gameBoard.clientWidth;
        boardHeight = gameBoard.clientHeight;

        isGameRunning = false;
        isPaused = true;
        playerScore = 0;
        opponentScore = 0;
        playerScoreElement.textContent = `PLAYER: ${playerScore}`;
        opponentScoreElement.textContent = `STRES: ${opponentScore}`;
        opponentSpeedMultiplier = 1.0; 
        gameMessage.style.display = 'none';
        
        playerX = (boardWidth / 2) - (paddleWidth / 2); 
        opponentX = (boardWidth / 2) - (paddleWidth / 2); 
        bottomPaddle.style.left = `${playerX}px`;
        topPaddle.style.left = `${opponentX}px`;
        
        resetInputState(); 
        startCountdown(1); 
    }
    
    function updatePlayer(deltaTime) {
        let actualSpeed = FIXED_PADDLE_SPEED * deltaTime / 1000; 
        
        if (keys['ArrowLeft']) playerX -= actualSpeed;
        if (keys['ArrowRight']) playerX += actualSpeed;

        if (playerX < 0) playerX = 0;
        if (playerX > boardWidth - paddleWidth) playerX = boardWidth - paddleWidth;

        bottomPaddle.style.left = `${playerX}px`;
    }

    function updateOpponent(deltaTime) {
        const opponentCenter = opponentX + paddleWidth / 2;
        const ballCenter = ballX + ballSize / 2;
        const baseAISpeed = initialBallSpeed * 0.98;
        const aiSpeed = baseAISpeed * opponentSpeedMultiplier * deltaTime / 1000; 
        const margin = 2; 

        if (ballSpeedY < 0) { 
            if (ballCenter < opponentCenter - margin) opponentX -= aiSpeed;
            else if (ballCenter > opponentCenter + margin) opponentX += aiSpeed;
        }
        
        if (opponentX < 0) opponentX = 0;
        if (opponentX > boardWidth - paddleWidth) opponentX = boardWidth - paddleWidth;

        topPaddle.style.left = `${opponentX}px`;
    }

    function updateBall(deltaTime) {
        const moveX = ballSpeedX * deltaTime / 1000;
        const moveY = ballSpeedY * deltaTime / 1000;

        ballX += moveX;
        ballY += moveY;

        if (ballX < 0 || ballX > boardWidth - ballSize) {
            ballSpeedX *= -1;
            ballX = ballX < 0 ? 0 : boardWidth - ballSize; 
        }

        const maxBounceY = bottomPaddle.offsetTop + paddleHeight;
        if (ballY + ballSize >= bottomPaddle.offsetTop && ballSpeedY > 0 && ballY < maxBounceY) {
            if (ballX + ballSize > playerX && ballX < playerX + paddleWidth) {
                triggerPaddleVFX(bottomPaddle, true);
                ballSpeedY *= -1; 
                const hitPoint = (ballX + ballSize/2) - (playerX + paddleWidth/2);
                ballSpeedX += hitPoint * 10; 
                ballSpeedX *= 1.075; 
                ballSpeedY *= 1.075; 
                ballY = bottomPaddle.offsetTop - ballSize; 
                return; 
            }
        }

        const topPaddleBottomY = topPaddle.offsetTop + paddleHeight;
        if (ballY <= topPaddleBottomY && ballSpeedY < 0) {
            if (ballX + ballSize > opponentX && ballX < opponentX + paddleWidth) {
                triggerPaddleVFX(topPaddle, false);
                ballSpeedY *= -1; 
                const hitPoint = (ballX + ballSize/2) - (opponentX + paddleWidth/2);
                ballSpeedX += hitPoint * 10;
                ballSpeedX *= 1.075; 
                ballSpeedY *= 1.075; 
                ballY = topPaddleBottomY; 
                return; 
            }
        }
        
        if (ballY < 0) { 
            playerScore++;
            playerScoreElement.textContent = `PLAYER: ${playerScore}`;
            opponentSpeedMultiplier += SPEED_INCREMENT_PER_POINT;

            if (playerScore >= maxScore) {
                gameOver(`PLAYER berhasil mengalahkan STRES! KAMU menang.`);
            } else {
                launchTransition(1); 
            }
            return;
        }

        if (ballY > boardHeight - ballSize) { 
            opponentScore++;
            opponentScoreElement.textContent = `STRES: ${opponentScore}`;
            if (opponentScore >= maxScore) {
                gameOver(`STRES telah menguasai! Kamu kalah.`);
            } else {
                launchTransition(-1); 
            }
            return;
        }

        ballElement.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
    }

    function gameOver(message) {
        isGameRunning = false;
        const finalMessageText = message.includes("menang") ? "✨ KEMENANGAN FOKUS! ✨" : "🚨 DIKUASAI STRES! 🚨";
        messageText.textContent = finalMessageText;
        gameMessage.style.display = 'flex'; 
    }

    function gameLoop(timestamp) {
        if (!isGameRunning || isPaused) return; 
        
        if (lastTimestamp === 0) lastTimestamp = timestamp;
        let deltaTime = timestamp - lastTimestamp;
        lastTimestamp = timestamp; 

        if (deltaTime > 50) deltaTime = 50; 

        updatePlayer(deltaTime);
        updateOpponent(deltaTime);
        updateBall(deltaTime);
        
        requestAnimationFrame(gameLoop);
    }

    resetGame(); 
</script>

</body>
</html>
