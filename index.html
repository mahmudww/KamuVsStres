<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!--
        V27
        Responsive + Mobile Controls + Lightweight SFX
        + Particle Pool + Subtle Scanline
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>PLAYER vs. STRES: The Mental Ping Pong</title>

    <style>
        /* =========================================================
           ROOT / WARNA
        ========================================================= */

        :root {
            --color-bg-dark: #161625;
            --color-bg-light: #202035;
            --color-focus: #4ecdc4;
            --color-stress: #ff6b6b;
            --color-ball: #ffee00;
            --color-text: #66fcf1;

            --game-width: 500px;
            --game-height: 700px;
        }

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 100dvh;

            padding:
                max(8px, env(safe-area-inset-top))
                max(8px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(8px, env(safe-area-inset-left));

            background-color: var(--color-bg-dark);

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            overflow: hidden;

            color: var(--color-text);

            touch-action: manipulation;
        }

        /* =========================================================
           ANIMASI
        ========================================================= */

        @keyframes pulse {
            0% {
                opacity: 0.35;
            }

            50% {
                opacity: 0.75;
            }

            100% {
                opacity: 0.35;
            }
        }

        @keyframes shake {
            0% {
                transform: translate3d(1px, 1px, 0);
            }

            25% {
                transform: translate3d(-2px, -2px, 0);
            }

            50% {
                transform: translate3d(-3px, 0, 0);
            }

            75% {
                transform: translate3d(3px, 2px, 0);
            }

            100% {
                transform: translate3d(1px, 1px, 0);
            }
        }

        /* =========================================================
           SCORE BAR
        ========================================================= */

        #info-bar {
            width: min(var(--game-width), 92vw);

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;

            margin-bottom: 10px;
            padding: 8px 14px;

            background-color: var(--color-bg-light);

            border-radius: 12px;

            font-size: clamp(0.72rem, 3vw, 1.15rem);
            font-weight: bold;

            box-shadow:
                -4px -4px 8px rgba(45, 45, 60, 0.35),
                4px 4px 8px rgba(0, 0, 0, 0.7);

            flex-shrink: 0;
        }

        #player-score {
            color: var(--color-focus);
        }

        #opponent-score {
            color: var(--color-stress);
            text-align: right;
        }

        /* =========================================================
           GAME BOARD
        ========================================================= */

        #game-board {
            /*
                GAME INTERNAL LOGIC:
                500 x 700

                DISPLAY:
                mengikuti ukuran layar.
            */

            width: min(var(--game-width), 92vw);
            aspect-ratio: 5 / 7;

            position: relative;

            overflow: hidden;

            background-color: var(--color-bg-dark);

            border: 3px solid var(--color-text);
            border-radius: 10px;

            box-shadow:
                inset 5px 5px 15px rgba(0, 0, 0, 0.8),
                inset -5px -5px 15px rgba(45, 45, 60, 0.35),
                0 0 35px rgba(102, 252, 241, 0.18);

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;

            /*
                Penting untuk HP:
                browser tidak mencoba scroll / zoom game.
            */
            touch-action: none;

            flex-shrink: 1;

            /*
                Membuat elemen absolute tetap relatif terhadap
                koordinat game internal.
            */
        }

        /*
            Karena physics menggunakan 500x700,
            kita memakai CSS custom scaling.
        */

        #game-board > * {
            /*
                Posisi game memakai sistem koordinat 500x700.
                Browser akan menskalakan seluruh board secara visual.
            */
        }

        /* =========================================================
           SUBTLE SCANLINE
        ========================================================= */

        #game-board::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            z-index: 150;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(102, 252, 241, 0.025) 0px,
                    rgba(102, 252, 241, 0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.45;
        }

        /*
            Saat user mengaktifkan mode reduced motion,
            scanline tetap ada tetapi tidak mengganggu.
        */

        /* =========================================================
           SCORE VFX
        ========================================================= */

        .score-focus-vfx {
            background-color: #0c3330 !important;
            border-color: var(--color-focus) !important;
        }

        .score-stress-vfx {
            background-color: #3b1212 !important;
            border-color: var(--color-stress) !important;
        }

        .board-shake {
            animation:
                shake 0.18s cubic-bezier(.36, .07, .19, .97)
                both;
        }

        /* =========================================================
           GARIS TENGAH
        ========================================================= */

        #center-line {
            position: absolute;

            top: 50%;
            left: 0;

            width: 100%;
            height: 2px;

            transform: translateY(-50%);

            background-color:
                rgba(102, 252, 241, 0.42);

            z-index: 5;

            animation:
                pulse 2.2s ease-in-out infinite;
        }

        /* =========================================================
           PADDLE ATAS
        ========================================================= */

        #top-paddle {
            position: absolute;

            top: 20px;
            left: 210px;

            width: 80px;
            height: 15px;

            background-color: var(--color-stress);

            border-radius: 5px;

            z-index: 10;

            will-change: transform;

            color: var(--color-bg-dark);

            font-size: 0.7em;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 0 8px rgba(255, 107, 107, 0.45);

            transition:
                background-color 0.05s,
                box-shadow 0.15s ease-out;
        }

        .paddle-bounce-stress {
            background-color: var(--color-ball) !important;
            transform:
                translate3d(0, 5px, 0);
        }

        .paddle-trail-stress {
            box-shadow:
                0 0 15px rgba(255, 107, 107, 0.85),
                0 0 5px rgba(255, 107, 107, 0.7) !important;
        }

        .paddle-afterglow-stress {
            box-shadow:
                0 0 28px var(--color-ball),
                0 0 8px var(--color-stress) !important;
        }

        /* =========================================================
           PADDLE BAWAH
        ========================================================= */

        #bottom-paddle {
            position: absolute;

            bottom: 20px;
            left: 210px;

            width: 80px;
            height: 15px;

            background-color: var(--color-focus);

            border-radius: 5px;

            z-index: 10;

            will-change: transform;

            color: var(--color-bg-dark);

            font-size: 0.7em;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 0 8px rgba(78, 205, 196, 0.45);

            transition:
                background-color 0.05s,
                box-shadow 0.15s ease-out;
        }

        .paddle-bounce-focus {
            background-color: var(--color-ball) !important;

            transform:
                translate3d(0, -5px, 0);
        }

        .paddle-trail-focus {
            box-shadow:
                0 0 15px rgba(78, 205, 196, 0.85),
                0 0 5px rgba(78, 205, 196, 0.7) !important;
        }

        .paddle-afterglow-focus {
            box-shadow:
                0 0 28px var(--color-ball),
                0 0 8px var(--color-focus) !important;
        }

        /* =========================================================
           BOLA
        ========================================================= */

        #ball {
            position: absolute;

            left: 0;
            top: 0;

            width: 15px;
            height: 15px;

            background-color: var(--color-ball);

            border-radius: 50%;

            z-index: 100;

            will-change: transform;

            box-shadow:
                0 0 7px var(--color-ball);

            /*
                Posisi digerakkan menggunakan transform.
                Ini lebih ramah GPU dibanding left/top setiap frame.
            */

            transition:
                opacity 0.15s ease;
        }

        .ball-explosion-vfx {
            transform:
                translate3d(var(--ball-x), var(--ball-y), 0)
                scale(3);

            opacity: 0;
        }

        /* =========================================================
           PARTICLE CONTAINER
        ========================================================= */

        #particle-container {
            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 90;

            overflow: hidden;
        }

        /*
            Particle pool.
            Tidak membuat / menghapus DOM setiap frame.
        */

        .particle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background-color: var(--color-ball);

            opacity: 0;

            transform:
                translate3d(0, 0, 0)
                scale(0.5);

            will-change:
                transform,
                opacity;

            box-shadow:
                0 0 4px var(--color-ball);

            pointer-events: none;
        }

        .particle.active {
            opacity: 0.65;

            transform:
                translate3d(0, 0, 0)
                scale(1);
        }

        /* =========================================================
           COUNTDOWN
        ========================================================= */

        #countdown-display {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: var(--color-ball);

            font-size: clamp(3rem, 12vw, 5rem);

            font-weight: bold;

            text-shadow:
                0 0 15px var(--color-ball);

            z-index: 300;

            display: none;

            pointer-events: none;
        }

        /* =========================================================
           GAME OVER
        ========================================================= */

        #game-message {
            position: absolute;

            inset: 0;

            background-color:
                rgba(0, 0, 0, 0.88);

            color: white;

            display: none;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 25px;

            font-size: clamp(1.2rem, 5vw, 2rem);

            text-align: center;

            z-index: 200;

            text-shadow:
                0 0 15px rgba(78, 205, 196, 0.7);
        }

        #final-score {
            margin-top: 10px;
            font-size: 0.65em;
            opacity: 0.8;
        }

        #game-message button {
            padding: 12px 22px;

            margin-top: 20px;

            font-size: 0.75em;

            cursor: pointer;

            background-color:
                var(--color-focus);

            color:
                var(--color-bg-dark);

            border: none;

            border-radius: 12px;

            box-shadow:
                -4px -4px 8px rgba(45, 45, 60, 0.35),
                4px 4px 8px rgba(0, 0, 0, 0.8),
                0 0 12px rgba(78, 205, 196, 0.45);

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }

        #game-message button:active {
            transform: scale(0.97);

            box-shadow:
                inset 3px 3px 5px rgba(0, 0, 0, 0.8);
        }

        /* =========================================================
           TOUCH CONTROLS
        ========================================================= */

        #touch-controls {
            width: min(var(--game-width), 92vw);

            display: flex;

            gap: 10px;

            margin-top: 10px;

            flex-shrink: 0;
        }

        .touch-button {
            flex: 1;

            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 10px;

            background-color:
                var(--color-bg-light);

            color:
                var(--color-focus);

            font-weight: bold;

            text-align: center;

            border-radius: 12px;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: none;

            -webkit-tap-highlight-color: transparent;

            box-shadow:
                -4px -4px 8px rgba(45, 45, 60, 0.35),
                4px 4px 8px rgba(0, 0, 0, 0.8),
                0 0 5px rgba(78, 205, 196, 0.4);

            transition:
                background-color 0.08s,
                color 0.08s,
                transform 0.08s;
        }

        .touch-button.active {
            background-color:
                var(--color-focus);

            color:
                var(--color-bg-dark);

            transform: scale(0.98);

            box-shadow:
                inset 3px 3px 5px rgba(0, 0, 0, 0.65);
        }

        /* =========================================================
           LAPTOP / DESKTOP
        ========================================================= */

        @media (min-width: 700px) and (min-height: 850px) {
            #info-bar {
                margin-bottom: 12px;
            }

            #touch-controls {
                margin-top: 12px;
            }
        }

        /* =========================================================
           HP KECIL
        ========================================================= */

        @media (max-height: 700px) {
            #info-bar {
                margin-bottom: 5px;
                padding: 6px 10px;
            }

            #touch-controls {
                margin-top: 5px;
            }

            .touch-button {
                min-height: 44px;
            }
        }

        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            #center-line {
                animation: none;
            }

            .board-shake {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         SCORE
    ========================================================== -->

    <div id="info-bar">
        <div id="player-score">
            PLAYER (Kamu): 0
        </div>

        <div id="opponent-score">
            STRES (Musuh): 0
        </div>
    </div>


    <!-- =========================================================
         GAME BOARD
    ========================================================== -->

    <div id="game-board">

        <div id="center-line"></div>

        <div id="top-paddle">
            STRES
        </div>

        <div id="ball"></div>

        <div id="bottom-paddle">
            PLAYER
        </div>

        <div id="particle-container"></div>

        <div id="countdown-display"></div>

        <div id="game-message">

            <div id="message-text"></div>

            <div id="final-score"></div>

            <button id="restart-button">
                COBA LAGI
            </button>

        </div>

    </div>


    <!-- =========================================================
         MOBILE CONTROLS
    ========================================================== -->

    <div id="touch-controls">

        <div
            class="touch-button"
            id="left-button"
            role="button"
            aria-label="Gerak kiri"
        >
            KIRI (◀)
        </div>

        <div
            class="touch-button"
            id="right-button"
            role="button"
            aria-label="Gerak kanan"
        >
            KANAN (▶)
        </div>

    </div>


    <script>
        /* =========================================================
           DOM
        ========================================================= */

        const gameBoard =
            document.getElementById('game-board');

        const bottomPaddle =
            document.getElementById('bottom-paddle');

        const topPaddle =
            document.getElementById('top-paddle');

        const ballElement =
            document.getElementById('ball');

        const particleContainer =
            document.getElementById('particle-container');

        const playerScoreElement =
            document.getElementById('player-score');

        const opponentScoreElement =
            document.getElementById('opponent-score');

        const gameMessage =
            document.getElementById('game-message');

        const messageText =
            document.getElementById('message-text');

        const finalScore =
            document.getElementById('final-score');

        const countdownDisplay =
            document.getElementById('countdown-display');

        const leftButton =
            document.getElementById('left-button');

        const rightButton =
            document.getElementById('right-button');

        const restartButton =
            document.getElementById('restart-button');


        /* =========================================================
           UKURAN GAME INTERNAL
           Jangan ubah.
        ========================================================== */

        const boardWidth = 500;
        const boardHeight = 700;

        const paddleWidth = 80;
        const paddleHeight = 15;

        const ballSize = 15;

        const STARTING_BALL_Y =
            (boardHeight / 3) -
            (ballSize / 3);


        /* =========================================================
           PLAYER
        ========================================================== */

        let playerX =
            (boardWidth / 2) -
            (paddleWidth / 2);

        let opponentX =
            (boardWidth / 2) -
            (paddleWidth / 2);

        const FIXED_PADDLE_SPEED = 800;

        let keys = {};


        /* =========================================================
           BALL
        ========================================================== */

        let ballX = 0;
        let ballY = 0;

        let ballSpeedX = 0;
        let ballSpeedY = 0;

        const initialBallSpeed = 500;


        /* =========================================================
           SCORE
        ========================================================== */

        let playerScore = 0;
        let opponentScore = 0;

        const maxScore = 5;


        /* =========================================================
           AI
        ========================================================== */

        let opponentSpeedMultiplier = 1.0;

        const SPEED_INCREMENT_PER_POINT = 0.15;


        /* =========================================================
           GAME STATE
        ========================================================== */

        let isGameRunning = false;
        let isPaused = true;

        let lastTimestamp = 0;

        let countdownTimer = null;


        /* =========================================================
           PERFORMANCE
        ========================================================== */

        /*
            Device dengan CPU <= 4 core diberi particle lebih sedikit.
        */

        const isLowPowerDevice =
            navigator.hardwareConcurrency &&
            navigator.hardwareConcurrency <= 4;

        const PARTICLE_COUNT =
            isLowPowerDevice ? 8 : 16;

        const PARTICLE_INTERVAL =
            isLowPowerDevice ? 55 : 40;

        let particleTimer = null;


        /* =========================================================
           AUDIO
        ========================================================== */

        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContext) {
                    return;
                }

                audioContext =
                    new AudioContext();
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }


        /*
            SFX dibuat langsung oleh browser.

            Tidak perlu MP3/WAV.
            Ukuran file tambahan = 0 KB.
        */

        function playSFX(
            frequency = 440,
            duration = 0.05,
            volume = 0.025,
            type = 'square'
        ) {
            if (!audioContext) {
                return;
            }

            try {
                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                const now =
                    audioContext.currentTime;

                oscillator.type = type;

                oscillator.frequency.setValueAtTime(
                    frequency,
                    now
                );

                gain.gain.setValueAtTime(
                    volume,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    now + duration
                );

                oscillator.connect(gain);

                gain.connect(
                    audioContext.destination
                );

                oscillator.start(now);

                oscillator.stop(
                    now + duration
                );
            } catch (error) {
                /*
                    Audio tidak boleh membuat game crash.
                */
            }
        }


        function playPaddleSFX(isPlayer) {
            initAudio();

            playSFX(
                isPlayer ? 520 : 380,
                0.045,
                0.022,
                'square'
            );
        }


        function playWallSFX() {
            initAudio();

            playSFX(
                300,
                0.035,
                0.015,
                'square'
            );
        }


        function playScoreSFX(isPlayer) {
            initAudio();

            if (isPlayer) {
                playSFX(
                    650,
                    0.07,
                    0.025,
                    'square'
                );

                setTimeout(() => {
                    playSFX(
                        900,
                        0.1,
                        0.02,
                        'square'
                    );
                }, 70);
            } else {
                playSFX(
                    220,
                    0.12,
                    0.025,
                    'sawtooth'
                );
            }
        }


        /* =========================================================
           PARTICLE POOL
        ========================================================== */

        const particles = [];

        function createParticlePool() {

            for (
                let i = 0;
                i < PARTICLE_COUNT;
                i++
            ) {
                const element =
                    document.createElement('div');

                element.className =
                    'particle';

                particleContainer.appendChild(
                    element
                );

                particles.push({
                    element: element,
                    life: 0,
                    maxLife: 0,
                    x: 0,
                    y: 0
                });
            }
        }


        function createBallParticle() {

            if (
                !isGameRunning ||
                isPaused
            ) {
                return;
            }

            /*
                Cari particle yang sedang tidak dipakai.
            */

            const particle =
                particles.find(
                    p => p.life <= 0
                );

            if (!particle) {
                return;
            }

            const element =
                particle.element;

            const size =
                Math.random() * 2 + 2;

            particle.x =
                ballX +
                ballSize / 2 -
                size / 2;

            particle.y =
                ballY +
                ballSize / 2 -
                size / 2;

            particle.life = 180;
            particle.maxLife = 180;

            element.style.width =
                `${size}px`;

            element.style.height =
                `${size}px`;

            element.style.left =
                `${particle.x}px`;

            element.style.top =
                `${particle.y}px`;

            element.style.boxShadow =
                `0 0 ${size}px var(--color-ball)`;

            element.classList.add(
                'active'
            );

            /*
                Particle akan di-fade oleh updateParticles()
                bukan setTimeout.
            */
        }


        function updateParticles(deltaTime) {

            for (const particle of particles) {

                if (particle.life <= 0) {
                    continue;
                }

                particle.life -=
                    deltaTime;

                const ratio =
                    Math.max(
                        0,
                        particle.life /
                        particle.maxLife
                    );

                particle.element.style.opacity =
                    `${ratio * 0.65}`;

                particle.element.style.transform =
                    `translate3d(
                        0,
                        ${-ratio * 5}px,
                        0
                    ) scale(${0.5 + ratio * 0.5})`;

                if (particle.life <= 0) {

                    particle.element.classList.remove(
                        'active'
                    );

                    particle.element.style.opacity =
                        '0';
                }
            }
        }


        function startParticleTrail() {

            stopParticleTrail();

            particleTimer =
                setInterval(
                    createBallParticle,
                    PARTICLE_INTERVAL
                );
        }


        function stopParticleTrail() {

            if (particleTimer) {

                clearInterval(
                    particleTimer
                );

                particleTimer = null;
            }
        }


        function clearParticles() {

            for (const particle of particles) {

                particle.life = 0;

                particle.element.classList.remove(
                    'active'
                );

                particle.element.style.opacity =
                    '0';
            }
        }


        /* =========================================================
           INPUT
        ========================================================== */

        function resetInputState() {

            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;

            leftButton.classList.remove(
                'active'
            );

            rightButton.classList.remove(
                'active'
            );

            bottomPaddle.classList.remove(
                'paddle-trail-focus'
            );

            topPaddle.classList.remove(
                'paddle-trail-stress'
            );
        }


        function setMovement(
            key,
            value
        ) {

            if (
                !isGameRunning ||
                isPaused
            ) {
                return;
            }

            keys[key] = value;
        }


        /* =========================================================
           KEYBOARD
        ========================================================== */

        document.addEventListener(
            'keydown',
            (event) => {

                if (
                    event.key === 'ArrowLeft' ||
                    event.key.toLowerCase() === 'a'
                ) {

                    event.preventDefault();

                    setMovement(
                        'ArrowLeft',
                        true
                    );
                }

                else if (
                    event.key === 'ArrowRight' ||
                    event.key.toLowerCase() === 'd'
                ) {

                    event.preventDefault();

                )`;

                '--ball-y',
                `${ballY}px`
            );

                tampilkan posisi normal.
            */

                !ballElement.classList.contains(
                    'ball-explosion-vfx'
                )
            ) {

                ballElement.style.transform =
                    `translate3d(
                        ${ballX}px,
                        ${ballY}px,
                        0
                    )`;
            }
        }


        /* =========================================================
           PADDLE VFX
        ========================================================== */

        function triggerPaddleVFX(
            paddleElement,
            vfxClass
        ) {

            const afterglowClass =
                vfxClass.includes('focus')
                    ? 'paddle-afterglow-focus'
                    : 'paddle-afterglow-stress';

            paddleElement.classList.add(

            );

            paddleElement.classList.add(

            );

            setTimeout(() => {

                );

            }, 90);


            setTimeout(() => {

                paddleElement.classList.remove(
                    afterglowClass
                );

            }, 180);
        }

        /* =========================================================
           BALL VFX
        ========================================================== */

        let lastBallGlowLevel = -1;


        function updateBallVFX() {

            if (
                !isGameRunning ||
                isPaused
            ) {

                if (
                    lastBallGlowLevel !== 0
                ) {

                    ballElement.style.boxShadow =
                        '0 0 7px var(--color-ball)';

                    lastBallGlowLevel = 0;
                }

                return;
            }


            const currentSpeed =
                Math.sqrt(
                    ballSpeedX ** 2 +
                    ballSpeedY ** 2
                );


            const maxSpeed =
                2.0 *
                initialBallSpeed;


            const ratio =
                Math.min(
                    1,
                    currentSpeed /
                    maxSpeed
                );


            /*
                Jangan ubah box-shadow setiap frame.

                Hanya 3 level glow.
            */

            const glowLevel =
                ratio < 0.45
                    ? 0
                    : ratio < 0.75
                        ? 1
                        : 2;


            if (
                glowLevel ===
                lastBallGlowLevel
            ) {
                return;
            }


            lastBallGlowLevel =
                glowLevel;


            if (glowLevel === 0) {

                ballElement.style.boxShadow =
                    '0 0 7px var(--color-ball)';

            }

            else if (glowLevel === 1) {

                ballElement.style.boxShadow =
                    '0 0 11px var(--color-ball)';

            }

            else {

                ballElement.style.boxShadow =
                    '0 0 16px var(--color-ball)';
            }
        }


        /* =========================================================
           PADDLE TRAIL
        ========================================================== */

        function updatePaddleTrail() {

            const playerIsMoving =
                keys['ArrowLeft'] ||
                keys['ArrowRight'];


            if (playerIsMoving) {

                bottomPaddle.classList.add(
                    'paddle-trail-focus'
                );

            } else {

                bottomPaddle.classList.remove(
                    'paddle-trail-focus'
                );
            }


            const isAITurn =
                ballSpeedY < 0;


            const isAIPursuing =
                Math.abs(
                    ballX +
                    ballSize / 2 -
                    (
                        opponentX +
                        paddleWidth / 2
                    )
                ) > 5;


            if (
                isAITurn &&
                isAIPursuing
            ) {

                topPaddle.classList.add(
                    'paddle-trail-stress'
                );

            } else {

                topPaddle.classList.remove(
                    'paddle-trail-stress'
                );
            }
        }


        /* =========================================================
           PLAYER UPDATE
        ========================================================== */

        function updatePlayer(
            deltaTime
        ) {

            const actualSpeed =
                FIXED_PADDLE_SPEED *
                deltaTime /
                1000;


            if (
                keys['ArrowLeft']
            ) {

                playerX -=
                    actualSpeed;
            }


            if (
                keys['ArrowRight']
            ) {

                playerX +=
                    actualSpeed;
            }


            if (playerX < 0) {
                playerX = 0;
            }


            if (
                playerX >
                boardWidth -
                paddleWidth
            ) {

                playerX =
                    boardWidth -
                    paddleWidth;
            }


            renderPaddles();
        }


        /* =========================================================
           AI UPDATE
        ========================================================== */

        function updateOpponent(
            deltaTime
        ) {

            const opponentCenter =
                opponentX +
                paddleWidth / 2;


            const ballCenter =
                ballX +
                ballSize / 2;


            const baseAISpeed =
                initialBallSpeed *
                0.98;


            const aiSpeed =
                baseAISpeed *
                opponentSpeedMultiplier *
                deltaTime /
                1000;


            const margin = 2;


            if (
                ballSpeedY < 0
            ) {

                if (
                    ballCenter <
                    opponentCenter -
                    margin
                ) {

                    opponentX -=
                        aiSpeed;

                }

                else if (
                    ballCenter >
                    opponentCenter +
                    margin
                ) {

                    opponentX +=
                        aiSpeed;
                }
            }


            if (
                opponentX < 0
            ) {

                opponentX = 0;
            }


            if (
                opponentX >
                boardWidth -
                paddleWidth
            ) {

                opponentX =
                    boardWidth -
                    paddleWidth;
            }


            renderPaddles();
        }


        /* =========================================================
           BALL UPDATE
        ========================================================== */

        function updateBall(
            deltaTime
        ) {

            const moveX =
                ballSpeedX *
                deltaTime /
                1000;


            const moveY =
                ballSpeedY *
                deltaTime /
                1000;


            ballX += moveX;
            ballY += moveY;


            /* -----------------------------------------------
               DINDING KIRI / KANAN
            ------------------------------------------------ */

            if (
                ballX < 0 ||
                ballX >
                boardWidth -
                ballSize
            ) {

                ballSpeedX *= -1;

                ballX =
                    ballX < 0
                        ? 0
                        : boardWidth -
                          ballSize;

                playWallSFX();
            }


            /* -----------------------------------------------
               PADDLE PLAYER
            ------------------------------------------------ */

            const bottomPaddleTop =
                boardHeight -
                20 -
                paddleHeight;


            const bottomPaddleBottom =
                bottomPaddleTop +
                paddleHeight;


            if (
                ballY +
                ballSize >=
                bottomPaddleTop &&

                ballSpeedY > 0 &&

                ballY <
                bottomPaddleBottom
            ) {

                if (
                    ballX +
                    ballSize >
                    playerX &&

                    ballX <
                    playerX +
                    paddleWidth
                ) {

                    triggerPaddleVFX(
                        bottomPaddle,
                        'paddle-bounce-focus'
                    );

                    playPaddleSFX(true);


                    ballSpeedY *= -1;


                    const hitPoint =
                        (
                            ballX +
                            ballSize / 2
                        ) -
                        (
                            playerX +
                            paddleWidth / 2
                        );


                    ballSpeedX +=
                        hitPoint * 10;


                    ballSpeedX *= 1.075;
                    ballSpeedY *= 1.075;


                    ballY =
                        bottomPaddleTop -
                        ballSize;


                    return;
                }
            }


            /* -----------------------------------------------
               PADDLE STRES
            ------------------------------------------------ */

            const topPaddleBottom =
                20 +
                paddleHeight;


            if (
                ballY <=
                topPaddleBottom &&

                ballSpeedY < 0
            ) {

                if (
                    ballX +
                    ballSize >
                    opponentX &&

                    ballX <
                    opponentX +
                    paddleWidth
                ) {

                    triggerPaddleVFX(
                        topPaddle,
                        'paddle-bounce-stress'
                    );

                    playPaddleSFX(false);


                    ballSpeedY *= -1;


                    const hitPoint =
                        (
                            ballX +
                            ballSize / 2
                        ) -
                        (
                            opponentX +
                            paddleWidth / 2
                        );


                    ballSpeedX +=
                        hitPoint * 10;


                    ballSpeedX *= 1.075;
                    ballSpeedY *= 1.075;


                    ballY =
                        topPaddleBottom;


                    return;
                }
            }


            /* -----------------------------------------------
               PLAYER SCORE
            ------------------------------------------------ */

            if (
                ballY < 0
            ) {

                playerScore++;


                playerScoreElement.textContent =
                    `PLAYER (Kamu): ${playerScore}`;


                opponentSpeedMultiplier +=
                    SPEED_INCREMENT_PER_POINT;


                playScoreSFX(true);


                if (
                    playerScore >=
                    maxScore
                ) {

                    gameOver(
                        `PLAYER berhasil mengalahkan STRES!`
                    );

                } else {

                    launchTransition(1);
                }


                return;
            }


            /* -----------------------------------------------
               STRES SCORE
            ------------------------------------------------ */

            if (
                ballY >
                boardHeight -
                ballSize
            ) {

                opponentScore++;


                opponentScoreElement.textContent =
                    `STRES (Musuh): ${opponentScore}`;


                playScoreSFX(false);


                if (
                    opponentScore >=
                    maxScore
                ) {

                    gameOver(
                        `STRES telah menguasai!`
                    );

                } else {

                    launchTransition(-1);
                }


                return;
            }


            /* -----------------------------------------------
               BATASI KECEPATAN
            ------------------------------------------------ */

            const currentSpeed =
                Math.sqrt(
                    ballSpeedX ** 2 +
                    ballSpeedY ** 2
                );


            const maxSpeed =
                2.0 *
                initialBallSpeed;


            if (
                currentSpeed >
                maxSpeed
            ) {

                const ratio =
                    maxSpeed /
                    currentSpeed;

                ballSpeedX *= ratio;
                ballSpeedY *= ratio;
            }


            renderBall();
        }


        /* =========================================================
           LAUNCH BALL
        ========================================================== */

        function launchBall(
            directionTo,
            scoringPlayerScore
        ) {

            ballSpeedY =
                initialBallSpeed *
                directionTo;


            let horizontalDirection;


            if (
                scoringPlayerScore % 2 === 0
            ) {

                horizontalDirection = 1;

            } else {

                horizontalDirection = -1;
            }


            ballSpeedX =
                horizontalDirection *
                initialBallSpeed *
                (
                    Math.random() *
                    0.5 +
                    0.5
                );


            const currentSpeed =
                Math.sqrt(
                    ballSpeedX ** 2 +
                    ballSpeedY ** 2
                );


            if (
                currentSpeed >
                initialBallSpeed *
                1.05
            ) {

                const ratio =
                    initialBallSpeed /
                    currentSpeed;


                ballSpeedX *= ratio;
                ballSpeedY *= ratio;
            }


            isPaused = false;
            isGameRunning = true;

            lastTimestamp = 0;

            renderBall();
        }
