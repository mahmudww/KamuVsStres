<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PLAYER vs. STRES: The Mental Ping Pong</title>

<style>
    :root {
        --color-bg-dark: #161625;
        --color-bg-light: #202035;
        --color-focus: #4ecdc4;
        --color-stress: #ff6b6b;
        --color-ball: #ffee00;
        --color-text: #66fcf1;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: .45;
        }

        50% {
            opacity: 1;
        }
    }

    @keyframes shake {
        0%   { transform: translate3d(1px, 1px, 0); }
        25%  { transform: translate3d(-2px, -2px, 0); }
        50%  { transform: translate3d(-3px, 0, 0); }
        75%  { transform: translate3d(3px, 2px, 0); }
        100% { transform: translate3d(0, 0, 0); }
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        margin: 0;
        padding: 10px;

        background:
            radial-gradient(
                circle at 50% 50%,
                rgba(78,205,196,.05),
                transparent 55%
            ),
            var(--color-bg-dark);

        font-family:
            'Segoe UI',
            Tahoma,
            Geneva,
            Verdana,
            sans-serif;

        color: var(--color-text);

        overflow: hidden;
        touch-action: none;
    }

    /* =========================
       INFO BAR
    ========================== */

    #info-bar {
        width: 100%;
        max-width: 500px;

        display: flex;
        justify-content: space-between;

        margin-bottom: 10px;
        padding: 10px 15px;

        background-color: var(--color-bg-light);

        border-radius: 12px;

        font-size: 1em;
        font-weight: bold;

        box-shadow:
            -4px -4px 8px rgba(45,45,60,.35),
            4px 4px 8px rgba(0,0,0,.65);
    }

    #player-score {
        color: var(--color-focus);
        text-shadow: 0 0 8px rgba(78,205,196,.5);
    }

    #opponent-score {
        color: var(--color-stress);
        text-shadow: 0 0 8px rgba(255,107,107,.5);
    }

    /* =========================
       GAME BOARD
    ========================== */

    #game-board {
        width: 100%;
        max-width: 500px;

        height: 60vh;
        max-height: 600px;

        position: relative;
        overflow: hidden;

        border: 3px solid var(--color-text);
        border-radius: 10px;

        background-color: var(--color-bg-dark);

        box-shadow:
            inset 4px 4px 12px rgba(0,0,0,.75),
            inset -4px -4px 12px rgba(45,45,60,.3),
            0 0 20px rgba(102,252,241,.16);

        transition:
            background-color .25s ease,
            border-color .25s ease;

        contain: layout paint style;
    }

    .board-shake {
        animation:
            shake .2s cubic-bezier(.36,.07,.19,.97) both;
    }

    .score-focus-vfx {
        background-color: #0c3330 !important;
        border-color: var(--color-focus) !important;

        box-shadow:
            inset 0 0 25px rgba(78,205,196,.15),
            0 0 30px rgba(78,205,196,.3) !important;
    }

    .score-stress-vfx {
        background-color: #3b1212 !important;
        border-color: var(--color-stress) !important;

        box-shadow:
            inset 0 0 25px rgba(255,107,107,.15),
            0 0 30px rgba(255,107,107,.3) !important;
    }

    /* =========================
       CENTER LINE
    ========================== */

    #center-line {
        position: absolute;

        top: 50%;
        left: 0;

        width: 100%;
        height: 2px;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(102,252,241,.8),
            transparent
        );

        transform: translateY(-50%);

        z-index: 5;

        animation: pulse 2s infinite ease-in-out;

        pointer-events: none;
    }

    /* =========================
       PADDLES
    ========================== */

    .paddle {
        position: absolute;

        width: 80px;
        height: 15px;

        border-radius: 5px;

        z-index: 10;

        display: flex;
        justify-content: center;
        align-items: center;

        color: var(--color-bg-dark);

        font-size: .7em;
        font-weight: bold;

        will-change: transform;

        transform: translate3d(0,0,0);

        /* Glow tetap ada, tapi jauh lebih murah */
        filter: drop-shadow(0 0 5px rgba(255,255,255,.15));
    }

    #top-paddle {
        top: 15px;

        background-color: var(--color-stress);

        box-shadow:
            0 0 8px rgba(255,107,107,.45);
    }

    #bottom-paddle {
        bottom: 15px;

        background-color: var(--color-focus);

        box-shadow:
            0 0 8px rgba(78,205,196,.45);
    }

    .paddle-trail-stress {
        box-shadow:
            0 0 12px rgba(255,107,107,.9),
            0 0 4px rgba(255,107,107,.9) !important;
    }

    .paddle-trail-focus {
        box-shadow:
            0 0 12px rgba(78,205,196,.9),
            0 0 4px rgba(78,205,196,.9) !important;
    }

    .paddle-bounce-stress {
        background-color: var(--color-ball) !important;
        transform: translate3d(0,5px,0) scaleX(1.05);
        box-shadow:
            0 0 18px var(--color-ball) !important;
    }

    .paddle-bounce-focus {
        background-color: var(--color-ball) !important;
        transform: translate3d(0,-5px,0) scaleX(1.05);
        box-shadow:
            0 0 18px var(--color-ball) !important;
    }

    /* =========================
       BALL
    ========================== */

    #ball {
        position: absolute;

        width: 15px;
        height: 15px;

        border-radius: 50%;

        background-color: var(--color-ball);

        z-index: 100;

        pointer-events: none;

        will-change: transform;

        transform: translate3d(0,0,0);

        box-shadow:
            0 0 7px rgba(255,238,0,.9),
            0 0 14px rgba(255,238,0,.45);
    }

    .ball-explosion-vfx {
        opacity: 0;
        transform:
            translate3d(var(--ball-x,0),var(--ball-y,0),0)
            scale(3);
    }

    /* =========================
       VFX CANVAS
    ========================== */

    #vfx-canvas {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        z-index: 90;

        pointer-events: none;

        contain: strict;
    }

    /* =========================
       COUNTDOWN
    ========================== */

    #countdown-display {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%,-50%);

        color: var(--color-ball);

        font-size: 4em;
        font-weight: bold;

        text-shadow:
            0 0 10px var(--color-ball),
            0 0 25px rgba(255,238,0,.5);

        z-index: 300;

        display: none;

        pointer-events: none;
    }

    /* =========================
       GAME MESSAGE
    ========================== */

    #game-message {
        position: absolute;

        inset: 0;

        background: rgba(0,0,0,.88);

        color: white;

        display: none;

        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        font-size: 1.5em;

        z-index: 200;

        text-shadow:
            0 0 15px rgba(78,205,196,.7);

        padding: 20px;
    }

    #final-score {
        margin-top: 8px;
        font-size: .65em;
        opacity: .8;
    }

    #game-message button {
        padding: 12px 24px;

        margin-top: 20px;

        font-size: .7em;
        font-weight: bold;

        cursor: pointer;

        background-color: var(--color-focus);
        color: var(--color-bg-dark);

        border: none;
        border-radius: 15px;

        box-shadow:
            0 0 15px rgba(78,205,196,.35);

        transition:
            transform .1s ease,
            background-color .1s ease;
    }

    #game-message button:active {
        transform: scale(.97);
    }

    /* =========================
       TOUCH CONTROLS
    ========================== */

    #touch-controls {
        width: 100%;
        max-width: 500px;

        display: flex;
        justify-content: space-between;

        margin-top: 15px;

        padding: 0 5px;
    }

    .touch-button {
        width: 48%;

        padding: 18px 0;

        background-color: var(--color-bg-light);

        color: var(--color-focus);

        font-weight: bold;

        text-align: center;

        border-radius: 15px;

        user-select: none;
        -webkit-user-select: none;

        box-shadow:
            -4px -4px 8px rgba(45,45,60,.35),
            4px 4px 8px rgba(0,0,0,.65),
            0 0 5px rgba(78,205,196,.3);

        transition:
            transform .08s ease,
            background-color .08s ease;
    }

    .touch-button:active,
    .touch-button.active {
        background-color: var(--color-focus);
        color: var(--color-bg-dark);

        transform: scale(.97);

        box-shadow:
            inset 3px 3px 5px rgba(0,0,0,.5);
    }

    /* HP KECIL */
    @media (max-width: 380px) {
        #game-board {
            height: 58vh;
        }

        .touch-button {
            padding: 16px 0;
        }

        #countdown-display {
            font-size: 3.5em;
        }
    }

    /* Jika device benar-benar low power */
    @media (prefers-reduced-motion: reduce) {
        #center-line {
            animation: none;
        }

        .board-shake {
            animation: none;
        }
    }
</style>
</head>

<body>

<div id="info-bar">
    <div id="player-score">PLAYER: 0</div>
    <div id="opponent-score">STRES: 0</div>
</div>

<div id="game-board">

    <div id="center-line"></div>

    <div id="top-paddle" class="paddle">
        STRES
    </div>

    <div id="ball"></div>

    <div id="bottom-paddle" class="paddle">
        PLAYER
    </div>

    <!-- Semua particle sekarang digambar di SATU canvas -->
    <canvas id="vfx-canvas"></canvas>

    <div id="countdown-display"></div>

    <div id="game-message">

        <div id="message-text"></div>

        <div id="final-score"></div>

        <button id="restart-button">
            COBA LAGI
        </button>

    </div>

</div>

<div id="touch-controls">

    <div class="touch-button" id="left-button">
        KIRI (&#9664;)
    </div>

    <div class="touch-button" id="right-button">
        KANAN (&#9654;)
    </div>

</div>


<script>
/* =========================================================
   ELEMENT
========================================================= */

const gameBoard = document.getElementById('game-board');

const bottomPaddle =
    document.getElementById('bottom-paddle');

const topPaddle =
    document.getElementById('top-paddle');

const ballElement =
    document.getElementById('ball');

const canvas =
    document.getElementById('vfx-canvas');

const ctx =
    canvas.getContext('2d', {
        alpha: true
    });

const playerScoreElement =
    document.getElementById('player-score');

const opponentScoreElement =
    document.getElementById('opponent-score');

const gameMessage =
    document.getElementById('game-message');

const messageText =
    document.getElementById('message-text');

const finalScore =
    document.getElementById('final-score');

const countdownDisplay =
    document.getElementById('countdown-display');

const leftButton =
    document.getElementById('left-button');

const rightButton =
    document.getElementById('right-button');

const restartButton =
    document.getElementById('restart-button');


/* =========================================================
   BOARD
========================================================= */

let boardWidth = 0;
let boardHeight = 0;

let dpr = 1;

function resizeBoard() {

    boardWidth = gameBoard.clientWidth;
    boardHeight = gameBoard.clientHeight;

    /*
     * Batasi DPR.
     *
     * HP tertentu punya DPR 3 atau 4.
     * Canvas 500x600 × DPR 4 = sangat besar.
     *
     * DPR 1.5 cukup untuk VFX game kecil seperti ini.
     */

    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.floor(boardWidth * dpr);
    canvas.height = Math.floor(boardHeight * dpr);

    canvas.style.width = boardWidth + 'px';
    canvas.style.height = boardHeight + 'px';

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resizeBoard();

window.addEventListener('resize', resizeBoard);


/* =========================================================
   GAME CONSTANTS
========================================================= */

const paddleWidth = 80;
const paddleHeight = 15;
const ballSize = 15;

const FIXED_PADDLE_SPEED = 800;
const initialBallSpeed = 500;

const maxScore = 5;

const SPEED_INCREMENT_PER_POINT = 0.15;


/* =========================================================
   GAME STATE
========================================================= */

let playerX = 0;
let opponentX = 0;

let ballX = 0;
let ballY = 0;

let ballSpeedX = 0;
let ballSpeedY = 0;

let playerScore = 0;
let opponentScore = 0;

let opponentSpeedMultiplier = 1;

let isGameRunning = false;
let isPaused = true;

let lastTimestamp = 0;

let animationFrame = null;

const keys = {
    ArrowLeft: false,
    ArrowRight: false
};


/* =========================================================
   PARTICLE SYSTEM
   ================================================

   IMPORTANT:

   Versi lama:
   1 particle = 1 DOM element.

   Versi ini:
   semua particle = canvas.

   Jadi browser tidak perlu:
   createElement()
   appendChild()
   classList()
   setTimeout()
   remove()

========================================================= */

const particles = [];

const MAX_PARTICLES = 32;

function spawnParticle(
    x,
    y,
    color = '#ffee00',
    power = 1
) {

    /*
     * Kalau particle penuh,
     * recycle particle paling tua.
     */

    if (particles.length >= MAX_PARTICLES) {
        particles.shift();
    }

    const angle =
        Math.random() * Math.PI * 2;

    const speed =
        (20 + Math.random() * 45) * power;

    particles.push({
        x,
        y,

        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,

        life: 1,

        decay:
            0.025 + Math.random() * 0.025,

        size:
            1.5 + Math.random() * 2.5,

        color
    });
}


/* =========================================================
   BALL TRAIL
========================================================= */

let trailTimer = 0;

function updateBallTrail(deltaTime) {

    trailTimer += deltaTime;

    /*
     * Sekitar 12 particle / detik.
     *
     * Tapi karena canvas, hasilnya tetap smooth.
     */

    if (trailTimer >= 80) {

        trailTimer = 0;

        spawnParticle(
            ballX + ballSize / 2,
            ballY + ballSize / 2,
            '#ffee00',
            .45
        );
    }
}


/* =========================================================
   HIT BURST
========================================================= */

function createHitBurst(
    x,
    y,
    color
) {

    /*
     * 7 particle cukup untuk menghasilkan
     * efek impact tanpa membebani HP.
     */

    for (let i = 0; i < 7; i++) {

        const p = {
            x,
            y,

            vx:
                (Math.random() - .5) * 180,

            vy:
                (Math.random() - .5) * 180,

            life: 1,

            decay:
                .045 + Math.random() * .025,

            size:
                2 + Math.random() * 3,

            color
        };

        particles.push(p);
    }

    /*
     * Batasi jumlah total.
     */

    while (particles.length > MAX_PARTICLES) {
        particles.shift();
    }
}


/* =========================================================
   SCORE BURST
========================================================= */

function createScoreBurst(color) {

    const centerX = boardWidth / 2;
    const centerY = boardHeight / 2;

    for (let i = 0; i < 18; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            50 + Math.random() * 130;

        particles.push({
            x: centerX,
            y: centerY,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: 1,

            decay:
                .025 + Math.random() * .025,

            size:
                2 + Math.random() * 3,

            color
        });
    }

    while (particles.length > MAX_PARTICLES) {
        particles.shift();
    }
}


/* =========================================================
   UPDATE + DRAW VFX
========================================================= */

function updateParticles(deltaTime) {

    const dt = deltaTime / 16.67;

    ctx.clearRect(
        0,
        0,
        boardWidth,
        boardHeight
    );

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * deltaTime / 1000;
        p.y += p.vy * deltaTime / 1000;

        p.vx *= Math.pow(.97, dt);
        p.vy *= Math.pow(.97, dt);

        p.life -= p.decay * dt;

        if (p.life <= 0) {

            particles.splice(i, 1);

            continue;
        }

        ctx.globalAlpha =
            Math.max(0, p.life);

        /*
         * Glow kecil.
         *
         * Tidak menggunakan CSS box-shadow.
         */

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /*
         * Core glow kecil.
         */

        if (p.size > 2.5) {

            ctx.globalAlpha =
                p.life * .25;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size * 2.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   INPUT
========================================================= */

function resetInputState() {

    keys.ArrowLeft = false;
    keys.ArrowRight = false;

    leftButton.classList.remove('active');
    rightButton.classList.remove('active');

    bottomPaddle.classList.remove(
        'paddle-trail-focus'
    );

    topPaddle.classList.remove(
        'paddle-trail-stress'
    );
}


function setMovement(key, value) {

    if (!isGameRunning || isPaused) {
        return;
    }

    keys[key] = value;
}


/* Keyboard */

document.addEventListener(
    'keydown',
    e => {

        if (
            e.key === 'ArrowLeft' ||
            e.key.toLowerCase() === 'a'
        ) {
            setMovement(
                'ArrowLeft',
                true
            );
        }

        if (
            e.key === 'ArrowRight' ||
            e.key.toLowerCase() === 'd'
        ) {
            setMovement(
                'ArrowRight',
                true
            );
        }

        if (e.key.includes('Arrow')) {
            e.preventDefault();
        }
    },
    { passive: false }
);


document.addEventListener(
    'keyup',
    e => {

        if (
            e.key === 'ArrowLeft' ||
            e.key.toLowerCase() === 'a'
        ) {
            setMovement(
                'ArrowLeft',
                false
            );
        }

        if (
            e.key === 'ArrowRight' ||
            e.key.toLowerCase() === 'd'
        ) {
            setMovement(
                'ArrowRight',
                false
            );
        }
    }
);


/* =========================================================
   TOUCH
========================================================= */

function startMoveLeft(e) {

    e.preventDefault();

    leftButton.classList.add('active');

    setMovement(
        'ArrowLeft',
        true
    );
}


function startMoveRight(e) {

    e.preventDefault();

    rightButton.classList.add('active');

    setMovement(
        'ArrowRight',
        true
    );
}


function stopMove() {

    keys.ArrowLeft = false;
    keys.ArrowRight = false;

    leftButton.classList.remove('active');
    rightButton.classList.remove('active');
}


/*
 * Pointer events lebih sederhana
 * daripada mousedown + touchstart + touchend.
 */

leftButton.addEventListener(
    'pointerdown',
    startMoveLeft
);

rightButton.addEventListener(
    'pointerdown',
    startMoveRight
);

leftButton.addEventListener(
    'pointerup',
    stopMove
);

rightButton.addEventListener(
    'pointerup',
    stopMove
);

leftButton.addEventListener(
    'pointercancel',
    stopMove
);

rightButton.addEventListener(
    'pointercancel',
    stopMove
);

leftButton.addEventListener(
    'pointerleave',
    stopMove
);

rightButton.addEventListener(
    'pointerleave',
    stopMove
);


/* =========================================================
   POSITIONING
========================================================= */

function setBallPosition() {

    /*
     * transform dipakai untuk movement.
     * Tidak menggunakan left/top setiap frame.
     */

    ballElement.style.transform =
        `translate3d(
            ${ballX}px,
            ${ballY}px,
            0
        )`;
}


function setPaddlePositions() {

    bottomPaddle.style.transform =
        `translate3d(
            ${playerX}px,
            0,
            0
        )`;

    topPaddle.style.transform =
        `translate3d(
            ${opponentX}px,
            0,
            0
        )`;
}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(deltaTime) {

    const actualSpeed =
        FIXED_PADDLE_SPEED *
        deltaTime /
        1000;

    if (keys.ArrowLeft) {
        playerX -= actualSpeed;
    }

    if (keys.ArrowRight) {
        playerX += actualSpeed;
    }

    playerX =
        Math.max(
            0,
            Math.min(
                boardWidth - paddleWidth,
                playerX
            )
        );

    bottomPaddle.style.transform =
        `translate3d(
            ${playerX}px,
            0,
            0
        )`;
}


/* =========================================================
   AI
========================================================= */

function updateOpponent(deltaTime) {

    const opponentCenter =
        opponentX +
        paddleWidth / 2;

    const ballCenter =
        ballX +
        ballSize / 2;

    const baseAISpeed =
        initialBallSpeed * .98;

    const aiSpeed =
        baseAISpeed *
        opponentSpeedMultiplier *
        deltaTime /
        1000;

    const margin = 2;

    if (ballSpeedY < 0) {

        if (
            ballCenter <
            opponentCenter - margin
        ) {
            opponentX -= aiSpeed;
        }

        else if (
            ballCenter >
            opponentCenter + margin
        ) {
            opponentX += aiSpeed;
        }
    }

    opponentX =
        Math.max(
            0,
            Math.min(
                boardWidth - paddleWidth,
                opponentX
            )
        );

    topPaddle.style.transform =
        `translate3d(
            ${opponentX}px,
            0,
            0
        )`;
}


/* =========================================================
   PADDLE TRAIL
========================================================= */

let playerTrailState = false;
let aiTrailState = false;

function updatePaddleTrail() {

    const playerMoving =
        keys.ArrowLeft ||
        keys.ArrowRight;

    const aiMoving =
        ballSpeedY < 0 &&
        Math.abs(
            ballX +
            ballSize / 2 -
            (opponentX +
            paddleWidth / 2)
        ) > 5;


    /*
     * Hanya update class kalau status berubah.
     */

    if (playerMoving !== playerTrailState) {

        playerTrailState =
            playerMoving;

        bottomPaddle.classList.toggle(
            'paddle-trail-focus',
            playerMoving
        );
    }


    if (aiMoving !== aiTrailState) {

        aiTrailState =
            aiMoving;

        topPaddle.classList.toggle(
            'paddle-trail-stress',
            aiMoving
        );
    }
}


/* =========================================================
   BALL VFX
========================================================= */

function updateBallGlow() {

    const speed =
        Math.sqrt(
            ballSpeedX * ballSpeedX +
            ballSpeedY * ballSpeedY
        );

    const ratio =
        Math.min(
            1,
            speed /
            (initialBallSpeed * 2)
        );

    /*
     * Glow tidak dibuat setiap frame
     * menggunakan box-shadow dinamis.
     *
     * Hanya ubah opacity/filter-like visual
     * melalui CSS variable.
     */

    ballElement.style.setProperty(
        '--ball-glow',
        (7 + ratio * 7) + 'px'
    );
}


/* =========================================================
   PADDLE HIT VFX
========================================================= */

function triggerPaddleVFX(
    paddleElement,
    vfxClass,
    color
) {

    paddleElement.classList.add(
        vfxClass
    );

    createHitBurst(
        ballX + ballSize / 2,
        ballY + ballSize / 2,
        color
    );

    setTimeout(() => {

        paddleElement.classList.remove(
            vfxClass
        );

    }, 100);
}


/* =========================================================
   SCORE VFX
========================================================= */

function triggerScoreVFX(
    isPlayerScore
) {

    const vfxClass =
        isPlayerScore
            ? 'score-focus-vfx'
            : 'score-stress-vfx';

    const color =
        isPlayerScore
            ? '#4ecdc4'
            : '#ff6b6b';

    gameBoard.classList.add(
        vfxClass
    );

    gameBoard.classList.add(
        'board-shake'
    );

    createScoreBurst(color);

    setTimeout(() => {

        gameBoard.classList.remove(
            vfxClass
        );

        gameBoard.classList.remove(
            'board-shake'
        );

    }, 400);
}


/* =========================================================
   BALL EXPLOSION
========================================================= */

function triggerBallExplosion() {

    createScoreBurst('#ffee00');

    ballElement.classList.add(
        'ball-explosion-vfx'
    );

    setTimeout(() => {

        ballElement.classList.remove(
            'ball-explosion-vfx'
        );

    }, 180);
}


/* =========================================================
   BALL
========================================================= */

function updateBall(deltaTime) {

    const moveX =
        ballSpeedX *
        deltaTime /
        1000;

    const moveY =
        ballSpeedY *
        deltaTime /
        1000;

    ballX += moveX;
    ballY += moveY;


    /* WALL */

    if (
        ballX < 0 ||
        ballX >
        boardWidth - ballSize
    ) {

        ballSpeedX *= -1;

        ballX =
            ballX < 0
                ? 0
                : boardWidth - ballSize;

        createHitBurst(
            ballX + ballSize / 2,
            ballY + ballSize / 2,
            '#ffee00'
        );
    }


    /* PLAYER PADDLE */

    const playerPaddleTop =
        boardHeight - 15 - paddleHeight;

    if (
        ballY + ballSize >=
        playerPaddleTop &&

        ballSpeedY > 0 &&

        ballY < playerPaddleTop +
                paddleHeight
    ) {

        if (
            ballX + ballSize >
            playerX &&

            ballX <
            playerX + paddleWidth
        ) {

            triggerPaddleVFX(
                bottomPaddle,
                'paddle-bounce-focus',
                '#4ecdc4'
            );

            ballSpeedY *= -1;

            const hitPoint =
                (ballX + ballSize / 2) -
                (playerX + paddleWidth / 2);

            ballSpeedX +=
                hitPoint * 10;

            ballSpeedX *= 1.075;
            ballSpeedY *= 1.075;

            ballY =
                playerPaddleTop -
                ballSize;

            return;
        }
    }


    /* AI PADDLE */

    const topPaddleBottomY =
        15 + paddleHeight;

    if (
        ballY <= topPaddleBottomY &&
        ballSpeedY < 0
    ) {

        if (
            ballX + ballSize >
            opponentX &&

            ballX <
            opponentX + paddleWidth
        ) {

            triggerPaddleVFX(
                topPaddle,
                'paddle-bounce-stress',
                '#ff6b6b'
            );

            ballSpeedY *= -1;

            const hitPoint =
                (ballX + ballSize / 2) -
                (opponentX + paddleWidth / 2);

            ballSpeedX +=
                hitPoint * 10;

            ballSpeedX *= 1.075;
            ballSpeedY *= 1.075;

            ballY =
                topPaddleBottomY;

            return;
        }
    }


    /* PLAYER SCORES */

    if (ballY < 0) {

        playerScore++;

        playerScoreElement.textContent =
            `PLAYER: ${playerScore}`;

        opponentSpeedMultiplier +=
            SPEED_INCREMENT_PER_POINT;

        if (
            playerScore >= maxScore
        ) {

            gameOver(
                'PLAYER berhasil mengalahkan STRES! KAMU menang.'
            );

        } else {

            launchTransition(1);
        }

        return;
    }


    /* STRES SCORES */

    if (
        ballY >
        boardHeight - ballSize
    ) {

        opponentScore++;

        opponentScoreElement.textContent =
            `STRES: ${opponentScore}`;

        if (
            opponentScore >= maxScore
        ) {

            gameOver(
                'STRES telah menguasai! Kamu kalah.'
            );

        } else {

            launchTransition(-1);
        }

        return;
    }


    /* SPEED LIMIT */

    const currentSpeed =
        Math.sqrt(
            ballSpeedX * ballSpeedX +
            ballSpeedY * ballSpeedY
        );

    const maxSpeed =
        2 * initialBallSpeed;

    if (
        currentSpeed >
        maxSpeed
    ) {

        const ratio =
            maxSpeed /
            currentSpeed;

        ballSpeedX *= ratio;
        ballSpeedY *= ratio;
    }


    setBallPosition();
}


/* =========================================================
   LAUNCH BALL
========================================================= */

function launchBall(
    directionTo,
    scoringPlayerScore
) {

    ballSpeedY =
        initialBallSpeed *
        directionTo;

    const horizontalDirection =
        scoringPlayerScore % 2 === 0
            ? 1
            : -1;

    ballSpeedX =
        horizontalDirection *
        initialBallSpeed *
        (
            Math.random() * .5 +
            .5
        );


    const currentSpeed =
        Math.sqrt(
            ballSpeedX * ballSpeedX +
            ballSpeedY * ballSpeedY
        );


    if (
        currentSpeed >
        initialBallSpeed * 1.05
    ) {

        const ratio =
            initialBallSpeed /
            currentSpeed;

        ballSpeedX *= ratio;
        ballSpeedY *= ratio;
    }


    isPaused = false;
    isGameRunning = true;

    lastTimestamp = 0;

    /*
     * Baru mulai loop ketika game benar-benar jalan.
     */

    if (!animationFrame) {
        animationFrame =
            requestAnimationFrame(
                gameLoop
            );
    }
}


/* =========================================================
   RESET ROUND
========================================================= */

function setupRound() {

    ballX =
        boardWidth / 2 -
        ballSize / 2;

    ballY =
        boardHeight / 3 -
        ballSize / 3;

    ballSpeedX = 0;
    ballSpeedY = 0;

    playerX =
        boardWidth / 2 -
        paddleWidth / 2;

    opponentX =
        boardWidth / 2 -
        paddleWidth / 2;

    setBallPosition();
    setPaddlePositions();

    ballElement.style.opacity = '1';

    particles.length = 0;

    trailTimer = 0;
}


/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(
    directionTo
) {

    isGameRunning = false;
    isPaused = true;

    resetInputState();

    setupRound();

    countdownDisplay.style.display =
        'block';

    let count = 3;

    countdownDisplay.textContent =
        count;


    const countdownInterval =
        setInterval(() => {

            count--;

            if (count > 0) {

                countdownDisplay.textContent =
                    count;

            } else {

                clearInterval(
                    countdownInterval
                );

                countdownDisplay.textContent =
                    'FOKUS!';


                setTimeout(() => {

                    countdownDisplay.style.display =
                        'none';

                    launchBall(
                        directionTo,
                        playerScore
                    );

                }, 500);
            }

        }, 1000);
}


/* =========================================================
   ROUND TRANSITION
========================================================= */

function launchTransition(
    directionTo
) {

    isGameRunning = false;
    isPaused = true;

    triggerScoreVFX(
        directionTo === 1
    );

    triggerBallExplosion();

    resetInputState();

    countdownDisplay.style.display =
        'block';

    countdownDisplay.textContent =
        '1';


    setTimeout(() => {

        setupRound();

    }, 180);


    setTimeout(() => {

        countdownDisplay.textContent =
            'FOKUS!';


        setTimeout(() => {

            countdownDisplay.style.display =
                'none';

            const currentScore =
                directionTo === 1
                    ? playerScore
                    : opponentScore;

            launchBall(
                directionTo,
                currentScore
            );

        }, 500);

    }, 1000);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(message) {

    isGameRunning = false;
    isPaused = true;

    resetInputState();

    createScoreBurst(
        message.includes('menang')
            ? '#4ecdc4'
            : '#ff6b6b'
    );

    messageText.textContent =
        message.includes('menang')
            ? '✨ KEMENANGAN FOKUS! ✨'
            : '🚨 DIKUASAI STRES! 🚨';

    finalScore.textContent =
        `PLAYER ${playerScore}  —  STRES ${opponentScore}`;

    gameMessage.style.display =
        'flex';
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    boardWidth =
        gameBoard.clientWidth;

    boardHeight =
        gameBoard.clientHeight;

    playerScore = 0;
    opponentScore = 0;

    opponentSpeedMultiplier = 1;

    isGameRunning = false;
    isPaused = true;

    playerScoreElement.textContent =
        'PLAYER: 0';

    opponentScoreElement.textContent =
        'STRES: 0';

    gameMessage.style.display =
        'none';

    particles.length = 0;

    setupRound();

    startCountdown(1);
}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function gameLoop(timestamp) {

    /*
     * PENTING:
     *
     * Tidak requestAnimationFrame lagi
     * ketika game sedang pause.
     */

    if (
        !isGameRunning ||
        isPaused
    ) {

        animationFrame = null;

        return;
    }


    if (lastTimestamp === 0) {
        lastTimestamp = timestamp;
    }


    let deltaTime =
        timestamp -
        lastTimestamp;

    lastTimestamp = timestamp;


    /*
     * Hindari physics meledak ketika
     * tab/browser sempat freeze.
     */

    if (deltaTime > 50) {
        deltaTime = 50;
    }


    updatePlayer(deltaTime);

    updateOpponent(deltaTime);

    updateBall(deltaTime);

    updatePaddleTrail();

    updateBallTrail(deltaTime);

    updateParticles(deltaTime);


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   RESTART BUTTON
========================================================= */

restartButton.addEventListener(
    'click',
    resetGame
);


/* =========================================================
   START
========================================================= */

resetGame();

</script>
